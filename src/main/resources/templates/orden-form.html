<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Orden</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
  <div class="sidebar">
    <img src="/img/logo.png" alt="Logo MXG">
    <a href="/" class="btn">INICIO</a>
    <a href="#" class="btn">CATÁLOGO</a>
    <a href="/productos" class="btn">PRODUCTOS</a>
    <a href="/usuarios" class="btn">USUARIOS</a>
    <a href="/ordenes" class="btn">ÓRDENES</a>
  </div>

  <div class="main-content">
    <div class="form-container">
      
        <h4 class="form-title">
          <i class="fa-solid fa-shopping-cart"></i> CREAR ORDEN
        </h4>

        <!-- Paso 1: Búsqueda de Usuario -->
        <div id="paso1" class="step-section">
          <h5 class="text-primary mb-3">
            <i class="fa-solid fa-search"></i> Paso 1: Buscar Cliente
          </h5>
          <div class="row">
            <div class="col-md-8">
              <label class="form-icon-label"><i class="fa-solid fa-user"></i> Buscar Cliente</label>
              <div class="input-group">
                <input type="text" id="buscarUsuario" class="form-control" placeholder="Ej: Juan Pérez, 12345678, Juan, Pérez...">
                <button type="button" class="btn btn-primary" onclick="buscarUsuario()">
                  <i class="fa-solid fa-search"></i>
                </button>
              </div>
            </div>
          </div>
          
          <div id="resultadosBusqueda" class="mt-3" style="display: none;">
            <h6>Resultados de la búsqueda:</h6>
            <div id="listaUsuarios" class="list-group"></div>
          </div>

          <div id="usuarioSeleccionado" class="mt-3 p-3 border rounded" style="display: none;">
            <h6 class="text-success">
              <i class="fa-solid fa-check"></i> Usuario Seleccionado:
            </h6>
            <div id="infoUsuario"></div>
            <button type="button" class="btn btn-success mt-2" onclick="continuarAPaso2()">
              Continuar con la Orden <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Paso 2: Formulario de Orden -->
        <div id="paso2" class="step-section" style="display: none;">
          <form th:action="@{/ordenes/guardar}" method="post" th:object="${orden}">
            <h5 class="text-primary mb-3">
              <i class="fa-solid fa-edit"></i> Paso 2: Detalles de la Orden
            </h5>
            
            <input type="hidden" id="usuarioDocumento" name="usuario.documento">
            
            <div class="row">
              <div class="col-md-6">

                <label class="form-icon-label">
                  <i class="fa-solid fa-calendar-day"></i> Fecha de Entrega
                </label>
                <input type="datetime-local" th:field="*{fechaEntrega}" class="form-control" required>

                <label class="form-icon-label">Debe a:</label>
                <span id="empresa" th:text="${empresa.nombreEmpresa + ' - NIT: ' + empresa.nitEmpresa}"></span>
                <input type="hidden" name="empresa.nitEmpresa" th:value="${empresa.nitEmpresa}" />
              </div>

              <div class="col-md-6">
                <div id="clienteInfo" class="p-3 border rounded bg-light">
                  <h6><i class="fa-solid fa-user"></i> Cliente Seleccionado:</h6>
                  <div id="datosCliente"></div>
                </div>

                <label class="form-icon-label mt-3"><i class="fa-solid fa-align-left"></i> Descripción Venta</label>
                <input type="text" class="form-control" th:field="*{descripcionVenta}" required>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center my-3">
              <button type="button" class="btn btn-outline-danger btn-xl" onclick="eliminarFila()">-</button>
              <h5 class="m-0">Detalles de la Orden</h5>
              <button type="button" class="btn btn-outline-success btn-sm" onclick="agregarFila()">+</button>
            </div>

            <table id="tablaDetalle" class="table tabla-usuarios">
              <thead class="table-light">
                <tr>
                  <th>Producto</th>
                  <th>Terminado</th>
                  <th>Cantidad</th>
                  <th>Valor</th>
                  <th>Descripción</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <select class="form-select" name="productoId">
                      <option value="">Seleccione un producto</option>
                      <option th:each="p : ${productos}" th:value="${p.id}" th:data-nombre="${p.nombre}" th:text="${p.nombre}"></option>
                    </select>
                  </td>
                  <td>
                    <select name="terminadoId" class="form-select select-terminado">
                      <option value="">Seleccione un terminado</option>
                    </select>
                  </td>
                  <td>
                    <div class="input-group justify-content-center align-items-center">
                      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="disminuir(this)">-</button>
                      <input type="number" class="form-control text-center" name="cantidad" value="1" min="1" required style="max-width: 70px; margin-bottom: 0px;">
                      <button type="button" class="btn btn-outline-secondary btn-sm" onclick="aumentar(this)">+</button>
                    </div>
                  </td>
                  <td>
                    <input type="number" class="form-control" name="valor" step="0.01" required>
                  </td>
                  <td>
                    <input type="text" class="form-control" name="descripcion">
                  </td>
                </tr>
              </tbody>
            </table>

            <div class="text-end fw-bold fs-5 mt-3">
              TOTAL: $<span id="totalOrden">0</span>
            </div>

            <input type="hidden" id="inputTotalOrden" name="totalFactura">

            <div class="col-12 d-flex justify-content-between">
                <button type="button" class="btn btn-secondary" onclick="volverAPaso1()">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
                <button type="submit" class="custom-btn">
                    <i class="fa-solid fa-save"></i> GUARDAR ORDEN
                </button>
            </div>
          </form>
        </div>
    </div>
  </div>

  <script th:src="@{/js/orden-validaciones.js}"></script>
  <script>
    let usuarioSeleccionadoGlobal = null;

    function buscarUsuario() {
      const termino = document.getElementById('buscarUsuario').value;
      if (termino.length < 2) {
        alert('Por favor ingrese al menos 2 caracteres para buscar');
        return;
      }

      fetch(`/ordenes/buscar-usuarios?termino=${encodeURIComponent(termino)}`)
        .then(response => response.json())
        .then(usuarios => {
          mostrarResultados(usuarios);
        })
        .catch(error => {
          console.error('Error al buscar usuarios:', error);
          alert('Error al buscar usuarios');
        });
    }

    function mostrarResultados(resultados) {
      const contenedor = document.getElementById('resultadosBusqueda');
      const lista = document.getElementById('listaUsuarios');
      
      lista.innerHTML = '';
      
      if (resultados.length === 0) {
        lista.innerHTML = '<div class="list-group-item">No se encontraron usuarios</div>';
      } else {
        resultados.forEach(usuario => {
          const item = document.createElement('div');
          item.className = 'list-group-item list-group-item-action';
          item.innerHTML = `
            <strong>${usuario.nombre} ${usuario.primerApellido}</strong><br>
            <small>Documento: ${usuario.documento} - Tipo: ${usuario.tipoUsuario.nombre}</small>
          `;
          item.onclick = () => seleccionarUsuario(usuario);
          lista.appendChild(item);
        });
      }
      
      contenedor.style.display = 'block';
    }

    function seleccionarUsuario(usuario) {
      usuarioSeleccionadoGlobal = usuario;
      
      document.getElementById('infoUsuario').innerHTML = `
        <strong>${usuario.nombre} ${usuario.primerApellido}</strong><br>
        <small>Documento: ${usuario.documento} - Tipo: ${usuario.tipoUsuario.nombre}</small>
      `;
      
      document.getElementById('usuarioSeleccionado').style.display = 'block';
      document.getElementById('resultadosBusqueda').style.display = 'none';
    }

    function continuarAPaso2() {
      if (!usuarioSeleccionadoGlobal) {
        alert('Por favor seleccione un usuario');
        return;
      }

      document.getElementById('usuarioDocumento').value = usuarioSeleccionadoGlobal.documento;
      
      document.getElementById('datosCliente').innerHTML = `
        <strong>${usuarioSeleccionadoGlobal.nombre} ${usuarioSeleccionadoGlobal.primerApellido}</strong><br>
        <small>Documento: ${usuarioSeleccionadoGlobal.documento}</small><br>
        <small>Tipo: ${usuarioSeleccionadoGlobal.tipoUsuario.nombre}</small>
      `;

      document.getElementById('paso1').style.display = 'none';
      document.getElementById('paso2').style.display = 'block';
      
      // Actualizar información del cliente para cálculos de precios
      actualizarClienteInfo();
    }

    function volverAPaso1() {
      document.getElementById('paso2').style.display = 'none';
      document.getElementById('paso1').style.display = 'block';
    }

    // Permitir buscar al presionar Enter
    document.getElementById('buscarUsuario').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        buscarUsuario();
      }
    });
  </script>
</body>
</html>
