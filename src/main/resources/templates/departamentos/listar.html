<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de Departamentos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div th:replace="~{menú/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="form-container">
            <!-- Mensajes de éxito/error -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-map"></i> LISTA DE DEPARTAMENTOS
                </h4>

                <a href="/departamentos/nuevo" class="custom-btn-accion">
                    <i class="fa-solid fa-plus" style="padding-right: 8px;"></i> NUEVO DEPARTAMENTO
                </a>
            </div>

            <table class="table tabla-usuarios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre del Departamento</th>
                        <th>Ciudades</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="departamento : ${departamentos}">
                        <td th:text="${departamento.id}"></td>
                        <td th:text="${departamento.nombre}"></td>
                        <td>
                            <span th:if="${departamento.ciudades != null and not #lists.isEmpty(departamento.ciudades)}"
                                th:text="${#lists.size(departamento.ciudades)} + ' ciudades'"
                                class="badge bg-info"></span>
                            <span th:if="${departamento.ciudades == null or #lists.isEmpty(departamento.ciudades)}"
                                class="text-muted">Sin ciudades</span>
                        </td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-dark btn-sm rounded-circle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-solid fa-ellipsis-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/departamentos/{id}/editar(id=${departamento.id})}">
                                            <i class="fa-solid fa-pen text-primary"></i> Editar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item btn-eliminar" href="javascript:void(0)"
                                            th:attr="data-id=${departamento.id}, data-nombre=${departamento.nombre}">
                                            <i class="fa-solid fa-trash text-danger"></i> Eliminar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/departamentos/{id}(id=${departamento.id})}">
                                            <i class="fa-solid fa-eye text-info"></i> Ver detalles
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Mensaje cuando no hay departamentos -->
            <div th:if="${#lists.isEmpty(departamentos)}" class="text-center mt-4">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    No hay departamentos registrados en el sistema.
                </div>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts de mensajes -->
    <script th:if="${mensaje}">
        Swal.fire({
            title: '¡Éxito!',
            text: /*[[${mensaje}]]*/ 'Operación realizada satisfactoriamente',
            icon: 'success',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#b8922f"
        })
    </script>

    <script th:if="${error}">
        Swal.fire({
            title: 'Error',
            text: /*[[${error}]]*/ 'Ocurrió un error',
            icon: 'error',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#d33"
        })
    </script>

    <script>
        // Event listener para botones de eliminar
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.btn-eliminar').forEach(button => {
                button.addEventListener('click', function () {
                    const id = this.getAttribute('data-id');
                    const nombre = this.getAttribute('data-nombre');
                    confirmarEliminar(id, nombre);
                });
            });
        });

        // Función para confirmar eliminación de departamento
        async function confirmarEliminar(id, nombre) {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                html: `<strong>Departamento: ${nombre}</strong><br><br>No podrás deshacer esta acción.<br><br><strong>⚠️ Advertencia:</strong> Si este departamento tiene ciudades asociadas, la eliminación podría fallar.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!result.isConfirmed) {
                return;
            }

            try {
                const response = await fetch(`/departamentos/${id}/eliminar`, {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    }
                });

                if (response.ok) {
                    Swal.fire(
                        '¡Eliminado!',
                        'El departamento ha sido eliminado con éxito.',
                        'success'
                    ).then(() => location.reload());
                } else {
                    const errorText = await response.text();
                    Swal.fire(
                        'Error',
                        `No se pudo eliminar el departamento. Código: ${response.status}`,
                        'error'
                    );
                }
            } catch (error) {
                Swal.fire(
                    'Error',
                    'Ocurrió un problema al intentar eliminar.',
                    'error'
                );
            }
        }
    </script>
</body>

</html>
