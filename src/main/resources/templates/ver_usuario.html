<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

   <div th:replace="menú/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="form-container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-eye"></i> DETALLES DEL USUARIO
                </h4>
                
                <div>
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.documento})}" 
                       class="btn me-2" 
                       style="background-color: #f3c623; color: #000; border-left: 5px solid #000;">
                        <i class="fa-solid fa-pen"></i> EDITAR
                    </a>
                    
                    <a href="/usuarios" 
                       class="btn" 
                       style="background-color: #000; color: white; border-left: 5px solid #f3c623;">
                        <i class="fa-solid fa-arrow-left"></i> VOLVER
                    </a>
                </div>
            </div>

            <div class="row">
                <!-- Información Personal -->
                <div class="col-md-6">
                    <div class="card mb-4" style="border-left: 5px solid #f3c623;">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0"><i class="fas fa-user me-2"></i>Información Personal</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-id-badge me-2"></i>Documento:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" th:text="${usuario.documento}"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-user me-2"></i>Nombre Completo:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" 
                                       th:text="${usuario.nombre} + (${usuario.primerApellido} ? ' ' + ${usuario.primerApellido} : '') + (${usuario.segundoApellido} ? ' ' + ${usuario.segundoApellido} : '')"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-phone me-2"></i>Teléfono:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" th:text="${usuario.telefono}"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-envelope me-2"></i>Correo Electrónico:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" 
                                       th:text="${usuario.correo != null and usuario.correo != ''} ? ${usuario.correo} : 'No registrado'"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-location-dot me-2"></i>Dirección:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" th:text="${usuario.direccion}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Información del Sistema -->
                <div class="col-md-6">
                    <div class="card mb-4" style="border-left: 5px solid #000;">
                        <div class="card-header text-white" style="background-color: #f3c623; color: #000 !important;">
                            <h5 class="mb-0 text-dark"><i class="fas fa-cog me-2"></i>Información del Sistema</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-user-tag me-2"></i>Tipo de Usuario:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" th:text="${usuario.tipoUsuario.nombre}"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-id-card me-2"></i>Perfil:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" th:text="${usuario.perfil.nombrePerfil}"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-user-circle me-2"></i>Nombre de Usuario:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" 
                                       th:text="${usuario.nombreUsuario != null and usuario.nombreUsuario != ''} ? ${usuario.nombreUsuario} : 'No asignado'"></p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-lock me-2"></i>Contraseña:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light">
                                        <span th:if="${usuario.contrasena != null and usuario.contrasena != ''}">
                                            <i class="fas fa-check-circle text-success me-2"></i>Configurada
                                        </span>
                                        <span th:if="${usuario.contrasena == null or usuario.contrasena == ''}">
                                            <i class="fas fa-times-circle text-danger me-2"></i>No configurada
                                        </span>
                                    </p>
                                </div>
                                
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-calendar me-2"></i>Fecha de Registro:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" 
                                       th:text="${usuario.fechaRegistro != null} ? ${#temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm')} : 'No disponible'"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Información de Ubicación -->
                <div class="col-12">
                    <div class="card" style="border-left: 5px solid #6c757d;">
                        <div class="card-header bg-secondary text-white">
                            <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2"></i>Ubicación</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-map me-2"></i>Departamento:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" 
                                       th:text="${usuario.ciudad != null and usuario.ciudad.departamento != null} ? ${usuario.ciudad.departamento.nombre} : 'No disponible'"></p>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold"><i class="fa-solid fa-city me-2"></i>Ciudad:</label>
                                    <p class="form-control-plaintext border rounded px-3 py-2 bg-light" 
                                       th:text="${usuario.ciudad != null} ? ${usuario.ciudad.nombre} : 'No disponible'"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
