<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Órdenes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="sidebar">
        <img src="/img/logo.png" alt="Logo MXG">
        <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> INICIO</a>
        <a href="/productos/catalogo" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO</a>
        <a href="/usuarios" class="btn"><i class="bi bi-people-fill"></i> USUARIOS</a>
        <a href="/ordenes" class="btn active"><i class="bi bi-receipt"></i> ÓRDENES</a>
        <a href="/productos" class="btn"><i class="bi bi-box-seam"></i> PRODUCTOS</a>
        <a href="/perfiles" class="btn"><i class="bi bi-person-badge"></i> PERFILES</a>
        <a href="/roles" class="btn"><i class="bi bi-shield-check"></i> ROLES</a>
        <a href="/reportes" class="btn"><i class="bi bi-file-earmark-bar-graph"></i> REPORTES</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn"><i class="bi bi-box-arrow-right"></i> CERRAR SESIÓN</button>
        </form>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-shopping-cart"></i> LISTA DE ÓRDENES</h2>
            <a th:href="@{/ordenes/nueva}" class="custom-btn">
                <i class="fa-solid fa-plus"></i> NUEVA ORDEN
            </a>
        </div>

        <div class="table-responsive">
            <table class="table tabla-usuarios">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Ciudad Cliente</th>
                        <th>Estado</th>
                        <th>Total</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="orden : ${ordenes}">
                        <td th:text="${orden.id}"></td>
                        <td th:text="${orden.usuario.nombre + ' ' + orden.usuario.primerApellido}"></td>
                        <td th:text="${#temporals.format(orden.fechaEntrega, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${orden.usuario.ciudad.nombre}"></td>
                        <td>
                            <span th:class="${orden.estado != null ? orden.estado.cssClass : 'badge bg-secondary'}"
                                  th:text="${orden.estado != null ? orden.estado.descripcion : 'Sin Estado'}"></span>
                        </td>
                        <td th:text="'$' + ${#numbers.formatDecimal(orden.totalFactura, 1, 2)}"></td>
                        <td th:text="${orden.descripcionVenta}"></td>
                        <td>
                            <a th:href="@{/ordenes/verMas/{id}(id=${orden.id})}" class="btn btn-outline-primary btn-sm me-1">
                                <i class="fa-solid fa-eye"></i> Ver
                            </a>
                            <a th:href="@{/ordenes/pdf/{id}(id=${orden.id})}" class="btn btn-outline-danger btn-sm">
                                <i class="fa-solid fa-file-pdf"></i> PDF
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${#lists.isEmpty(ordenes)}" class="text-center mt-5">
            <i class="fa-solid fa-shopping-cart fa-3x text-muted mb-3"></i>
            <h4 class="text-muted">No hay órdenes registradas</h4>
            <a th:href="@{/ordenes/nueva}" class="custom-btn mt-3">
                <i class="fa-solid fa-plus"></i> CREAR PRIMERA ORDEN
            </a>
        </div>
    </div>
</body>
</html>
