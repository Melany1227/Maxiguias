<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
</head>
<body>

   <div th:replace="menú/sidebar :: sidebar"></div> 

    <div class="main-content">
        <div class="form-container">

            <h4 class="form-title">
                <i class="fa-solid fa-id-card"></i> DATOS PERSONALES
            </h4>    

            <form th:action="${esEdicion} ? @{/usuarios/actualizar} : @{/usuarios}" 
                th:object="${usuario}" method="post" class="row g-3">


                <div class="col-md-6">
                    <label class="form-icon-label">
                        <i class="fa-solid fa-id-badge"></i> Documento *
                    </label>
                    <input type="text" th:field="*{documento}" name="documento" class="form-control" inputmode="numeric" pattern="[0-9]*" required
                           th:disabled="${esEdicion}">

                    <label class="form-icon-label">
                        <i class="fa-solid fa-user"></i> Nombre *
                    </label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-user"></i> Primer Apellido
                    </label>
                    <input type="text" th:field="*{primerApellido}" class="form-control" pattern="[a-zA-ZáéíóúñÁÉÍÓÚÑ\s\-']*" title="El apellido no puede contener números">

                    <label class="form-icon-label">
                        <i class="fa-solid fa-user"></i> Segundo Apellido
                    </label>
                    <input type="text" th:field="*{segundoApellido}" class="form-control" pattern="[a-zA-ZáéíóúñÁÉÍÓÚÑ\s\-']*" title="El apellido no puede contener números">

                    <label class="form-icon-label">
                        <i class="fa-solid fa-phone"></i> Teléfono *
                    </label>
                    <input type="text" th:field="*{telefono}" name="telefono" class="form-control" inputmode="numeric" pattern="[0-9]*" required>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-location-dot"></i> Dirección *
                    </label>
                    <input type="text" th:field="*{direccion}" class="form-control" required>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-envelope"></i> Correo Electrónico *
                    </label>
                    <input type="email" th:field="*{correo}" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-icon-label">
                        <i class="fa-solid fa-user"></i> Nombre de Usuario
                    </label>
                    <input type="text" th:field="*{nombreUsuario}" class="form-control">

                    <label class="form-icon-label">
                        <i class="fa-solid fa-lock"></i> Contraseña 
                    </label>
                    <div class="password-input-container">
                        <input type="password" th:field="*{contrasena}" 
                               th:placeholder="${esEdicion and tieneContrasena} ? '••••••••' : ''" 
                               class="form-control" id="contrasena">
                        <button type="button" class="password-toggle" onclick="togglePasswordAdmin('contrasena')">
                            <i class="fa-solid fa-eye" id="eye-contrasena"></i>
                        </button>
                    </div>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-lock"></i> Confirmar Contraseña 
                    </label>
                    <div class="password-input-container">
                        <input type="password" name="confirmarContrasena" 
                               placeholder="Confirma la contraseña" 
                               class="form-control" id="confirmarContrasena">
                        <button type="button" class="password-toggle" onclick="togglePasswordAdmin('confirmarContrasena')">
                            <i class="fa-solid fa-eye" id="eye-confirmarContrasena"></i>
                        </button>
                    </div>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-user"></i> Tipo de Usuario *
                    </label>
                    <select th:field="*{tipoUsuario}" class="form-control" required th:disabled="${esEdicion}">
                        <option value="">Seleccione</option>
                        <option th:each="tipo : ${tiposUsuario}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
                    </select>
                    <small th:if="!${esEdicion}" class="form-text text-muted d-block mt-2">
                        <i class="fa-solid fa-info-circle"></i>
                        <strong>Nota importante:</strong> Si registra un cliente <strong>Natural</strong>, no debe ingresar usuario ni contraseña.
                    </small>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-user"></i> Perfil *
                    </label>
                    <select th:field="*{perfil}" class="form-control" required th:disabled="${esEdicion}">
                        <option value="">Seleccione</option>
                        <option th:each="perfil : ${perfiles}" th:value="${perfil.id}" th:text="${perfil.nombrePerfil}"></option>
                    </select>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-map"></i> Departamento *
                    </label>
                    <select id="departamentoSelect" class="form-control" required onchange="cargarCiudades()">
                        <option value="">Seleccione un departamento</option>
                        <option th:each="departamento : ${departamentos}" 
                                th:value="${departamento.id}" 
                                th:text="${departamento.nombre}"
                                th:selected="${usuario.ciudad != null and usuario.ciudad.departamento != null and usuario.ciudad.departamento.id == departamento.id}">
                        </option>
                    </select>

                    <label class="form-icon-label">
                        <i class="fa-solid fa-location-dot"></i> Ciudad *
                    </label>
                    <select id="ciudadSelect" class="form-control" required name="ciudad.id">
                        <option value="">Seleccione primero un departamento</option>
                        <option th:each="ciudad : ${ciudades}"
                                th:value="${ciudad.id}"
                                th:text="${ciudad.nombre}"
                                th:selected="${usuario.ciudad != null and usuario.ciudad.id == ciudad.id}">
                        </option>
                    </select>
                </div>

                <div class="col-12 d-flex justify-content-end">
                    <button type="submit" class="custom-btn">
                        <i class="fa-solid fa-save"></i> GUARDAR
                    </button>
                </div>
                          
            </form>
        </div>
    </div>


    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Incluir validaciones de documento -->
    <script th:src="@{/js/validaciones.js}"></script>
    
    <!-- Scripts de mensajes -->
    <script th:if="${mensaje}">
        Swal.fire({
            title: '¡Éxito!',
            text: /*[[${mensaje}]]*/ 'Usuario creado satisfactoriamente',
            icon: 'success',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#b8922f"
        })
    </script>
    
    <script th:if="${error}">
        Swal.fire({
            title: 'Error',
            text: /*[[${error}]]*/ 'Ocurrió un error',
            icon: 'error',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#d33"
        })
    </script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        let mensajeModal = /*[[${mensajeModal}]]*/ null;
        let redirigir = /*[[${redirigirDespues}]]*/ false;
        let tipoMensaje = /*[[${tipoMensaje}]]*/ null;

        if (mensajeModal && mensajeModal !== 'null' && mensajeModal.trim() !== '') {
            const icono = tipoMensaje === 'error' ? 'error' : 'success';
            const titulo = tipoMensaje === 'error' ? 'Error' : '¡Éxito!';
            const color = tipoMensaje === 'error' ? '#d33' : '#b8922f';
            
            Swal.fire({
                title: titulo,
                text: mensajeModal,
                icon: icono,
                confirmButtonText: 'Aceptar',
                confirmButtonColor: color
            }).then(() => {
                if (redirigir) {
                    window.location.href = '/usuarios';
                }
            });
        }
        /*]]>*/
        // Función para alternar visibilidad de contraseñas
        function togglePasswordAdmin(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const eyeIcon = document.getElementById('eye-' + fieldId);
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const soloLetras = /^[A-Za-zÁÉÍÓÚÑáéíóúñ\s]+$/;

            const nombreInput = document.querySelector('[name="nombre"]');
            const primerApellidoInput = document.querySelector('[name="primerApellido"]');
            const segundoApellidoInput = document.querySelector('[name="segundoApellido"]');
            const contrasenaInput = document.getElementById('contrasena');
            const confirmarContrasenaInput = document.getElementById('confirmarContrasena');
            const formulario = document.querySelector('form');

            function esValido(input) {
                const valor = input.value.trim();
                return valor === '' || soloLetras.test(valor); // válido si está vacío o si cumple el patrón
            }

            formulario.addEventListener('submit', function (event) {
                let mensaje = '';

                if (!esValido(nombreInput)) {
                    mensaje = 'El campo nombre solo permite letras y espacios.';
                } else if (!esValido(primerApellidoInput)) {
                    mensaje = 'El campo primer apellido solo permite letras y espacios.';
                } else if (!esValido(segundoApellidoInput)) {
                    mensaje = 'El campo segundo apellido solo permite letras y espacios.';
                } else if (contrasenaInput.value && confirmarContrasenaInput.value && 
                          contrasenaInput.value !== confirmarContrasenaInput.value) {
                    mensaje = 'Las contraseñas no coinciden.';
                }

                if (mensaje) {
                    event.preventDefault();

                    Swal.fire({
                        title: 'Error de validación',
                        text: mensaje,
                        icon: 'error',
                        confirmButtonText: 'Aceptar',
                        confirmButtonColor: '#d33'
                    });
                }
            });
        });

        // Función para cargar ciudades según el departamento seleccionado
        function cargarCiudades() {
            const departamentoSelect = document.getElementById('departamentoSelect');
            const ciudadSelect = document.getElementById('ciudadSelect');
            const departamentoId = departamentoSelect.value;
            
            // Limpiar el select de ciudades
            ciudadSelect.innerHTML = '<option value="">Cargando ciudades...</option>';
            ciudadSelect.disabled = true;
            
            if (departamentoId) {
                fetch(`/api/departamentos/${departamentoId}/ciudades`)
                    .then(response => {
                        console.log('Response status:', response.status);
                        return response.json();
                    })
                    .then(ciudades => {
                        console.log('Ciudades recibidas:', ciudades);
                        console.log('Número de ciudades:', ciudades.length);
                        
                        ciudadSelect.innerHTML = '<option value="">Seleccione una ciudad</option>';
                        ciudades.forEach((ciudad, index) => {
                            console.log(`Ciudad ${index + 1}:`, ciudad);
                            const option = document.createElement('option');
                            option.value = ciudad.id;
                            option.textContent = ciudad.nombre;
                            ciudadSelect.appendChild(option);
                        });
                        ciudadSelect.disabled = false;
                        
                        console.log('Opciones en el select:', ciudadSelect.children.length);
                    })
                    .catch(error => {
                        console.error('Error al cargar ciudades:', error);
                        ciudadSelect.innerHTML = '<option value="">Error al cargar ciudades</option>';
                    });
            } else {
                ciudadSelect.innerHTML = '<option value="">Seleccione primero un departamento</option>';
                ciudadSelect.disabled = true;
            }
        }

        // Cargar ciudades al cargar la página si ya hay un departamento seleccionado
        document.addEventListener('DOMContentLoaded', function() {
            const departamentoSelect = document.getElementById('departamentoSelect');
            const ciudadSelect = document.getElementById('ciudadSelect');
            
            if (departamentoSelect.value) {
                const ciudadActualId = ciudadSelect.value; // Guardar el ID de la ciudad actual
                cargarCiudadesConSeleccion(ciudadActualId);
            }
        });
        
        // Función para cargar ciudades y seleccionar una específica
        function cargarCiudadesConSeleccion(ciudadIdASeleccionar) {
            const departamentoSelect = document.getElementById('departamentoSelect');
            const ciudadSelect = document.getElementById('ciudadSelect');
            const departamentoId = departamentoSelect.value;
            
            ciudadSelect.innerHTML = '<option value="">Cargando ciudades...</option>';
            ciudadSelect.disabled = true;
            
            if (departamentoId) {
                fetch(`/api/departamentos/${departamentoId}/ciudades`)
                    .then(response => response.json())
                    .then(ciudades => {
                        ciudadSelect.innerHTML = '<option value="">Seleccione una ciudad</option>';
                        ciudades.forEach(ciudad => {
                            const option = document.createElement('option');
                            option.value = ciudad.id;
                            option.textContent = ciudad.nombre;
                            
                            // Seleccionar la ciudad si coincide con la guardada
                            if (ciudadIdASeleccionar && ciudad.id == ciudadIdASeleccionar) {
                                option.selected = true;
                            }
                            
                            ciudadSelect.appendChild(option);
                        });
                        ciudadSelect.disabled = false;
                    })
                    .catch(error => {
                        console.error('Error al cargar ciudades:', error);
                        ciudadSelect.innerHTML = '<option value="">Error al cargar ciudades</option>';
                    });
            }
        }
    </script>

</body>
</html>
