<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Lista de Perfiles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div th:replace="menú/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="form-container">
            <!-- Mensajes de éxito/error -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-user-tag"></i> LISTA DE PERFILES
                </h4>

                <a href="/perfiles/nuevo" class="btn"
                    style="background-color: #000; color: white; width: 15%; margin-bottom: 15px; border-left: 5px solid #f3c623;">
                    <i class="fa-solid fa-plus" style="padding-right: 8px;"></i> NUEVO PERFIL
                </a>
            </div>

            <table class="table tabla-usuarios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre del Perfil</th>
                        <th>Rol Asignado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="perfil : ${perfiles}">
                        <td th:text="${perfil.id}"></td>
                        <td th:text="${perfil.nombrePerfil}"></td>
                        <td th:text="${perfil.rol.nombreRol}"></td>
                        <td>
                            <div class="dropdown">
                                <button class="btn btn-dark btn-sm rounded-circle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-solid fa-ellipsis-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/perfiles/{id}/editar(id=${perfil.id})}">
                                            <i class="fa-solid fa-pen text-primary"></i> Editar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item btn-eliminar" href="javascript:void(0)"
                                            th:attr="data-id=${perfil.id}, data-nombre=${perfil.nombrePerfil}, data-rol=${perfil.rol.nombreRol}">
                                            <i class="fa-solid fa-trash text-danger"></i> Eliminar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/perfiles/{id}(id=${perfil.id})}">
                                            <i class="fa-solid fa-eye text-info"></i> Ver detalles
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Mensaje cuando no hay perfiles -->
            <div th:if="${#lists.isEmpty(perfiles)}" class="text-center mt-4">
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    No hay perfiles registrados en el sistema.
                </div>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Scripts de mensajes -->
    <script th:if="${mensaje}">
        Swal.fire({
            title: '¡Éxito!',
            text: /*[[${mensaje}]]*/ 'Operación realizada satisfactoriamente',
            icon: 'success',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#b8922f"
        })
    </script>

    <script th:if="${error}">
        Swal.fire({
            title: 'Error',
            text: /*[[${error}]]*/ 'Ocurrió un error',
            icon: 'error',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#d33"
        })
    </script>

    <script>
        // Event listener para botones de eliminar
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.btn-eliminar').forEach(button => {
                button.addEventListener('click', function () {
                    const id = this.getAttribute('data-id');
                    const nombrePerfil = this.getAttribute('data-nombre');
                    const nombreRol = this.getAttribute('data-rol');
                    confirmarEliminar(id, nombrePerfil, nombreRol);
                });
            });
        });

        // Función para confirmar eliminación de perfil
        async function confirmarEliminar(id, nombrePerfil, nombreRol) {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                html: `<strong>Perfil: ${nombrePerfil}</strong><br>Rol: ${nombreRol}<br><br>No podrás deshacer esta acción.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!result.isConfirmed) {
                return;
            }

            try {
                const response = await fetch(`/perfiles/${id}/eliminar`, {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    }
                });

                if (response.ok) {
                    Swal.fire(
                        '¡Eliminado!',
                        'El perfil ha sido eliminado con éxito.',
                        'success'
                    ).then(() => location.reload());
                } else {
                    const errorText = await response.text();
                    Swal.fire(
                        'Error',
                        `No se pudo eliminar el perfil. Código: ${response.status}`,
                        'error'
                    );
                }
            } catch (error) {
                Swal.fire(
                    'Error',
                    'Ocurrió un problema al intentar eliminar.',
                    'error'
                );
            }
        }
    </script>
</body>

</html>
