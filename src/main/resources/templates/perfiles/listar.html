<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Perfiles</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
    </head>
    <body>
        <div class="sidebar">
            <img src="/img/logo.png" alt="Logo MXG">
            <a href="/" class="btn">INICIO</a>
            <a href="#" class="btn">CATÁLOGO</a>
            <a href="/usuarios" class="btn">USUARIOS</a>
            <a href="/facturas" class="btn">FACTURAS</a>
            <a href="/perfiles" class="btn active">PERFILES</a>
            <a href="/reportes" class="btn">REPORTES</a>
        </div>

        <div class="main-content">
            <div class="form-container">
                <!-- Mensajes de éxito/error -->
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="form-title m-0">
                        <i class="fa-solid fa-user-tag"></i> LISTA DE PERFILES
                    </h4>

                    <a href="/perfiles/nuevo" class="btn" style="background-color: #000; color: white; width: 15%; margin-bottom: 15px; border-left: 5px solid #f3c623;">
                        <i class="fa-solid fa-plus" style="padding-right: 8px;"></i> NUEVO PERFIL
                    </a>
                </div>

                <table class="table tabla-usuarios">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Perfil</th>
                            <th>Rol Asignado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="perfil : ${perfiles}">
                            <td th:text="${perfil.id}"></td>
                            <td th:text="${perfil.nombrePerfil}"></td>
                            <td th:text="${perfil.rol.nombreRol}"></td>
                            <td class="text-center">
                                <a th:href="@{/perfiles/{id}(id=${perfil.id})}"
                                   class="btn btn-outline-info btn-sm me-1"
                                   title="Ver detalles">
                                    <i class="fas fa-eye"></i>
                                </a>

                                <a th:href="@{/perfiles/{id}/editar(id=${perfil.id})}"
                                   class="btn btn-outline-warning btn-sm me-1"
                                   title="Editar">
                                    <i class="fas fa-pen"></i>
                                </a>

                                <button type="button"
                                        class="btn btn-outline-dark btn-sm"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target='#modalEliminar_' + ${perfil.id}"
                                        title="Eliminar">
                                    <i class="fas fa-trash"></i>
                                </button>

                                <!-- Modal de confirmación para eliminar -->
                                <div class="modal fade modal-custom"
                                     th:id="'modalEliminar_' + ${perfil.id}"
                                     tabindex="-1"
                                     aria-hidden="true"
                                     th:attr="aria-labelledby='labelEliminar_' + ${perfil.id}">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title"
                                                    th:id="'labelEliminar_' + ${perfil.id}">
                                                    ¿DESEAS ELIMINAR ESTE PERFIL?
                                                </h5>
                                            </div>
                                            <div class="modal-body">
                                                <strong th:text="'Perfil: ' + ${perfil.nombrePerfil}"></strong><br>
                                                <span th:text="'Rol: ' + ${perfil.rol.nombreRol}"></span><br><br>
                                                <em>Esta acción no se puede deshacer.</em>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button"
                                                        class="btn btn-cancelar"
                                                        data-bs-dismiss="modal">CANCELAR</button>
                                                <form th:action="@{/perfiles/{id}/eliminar(id=${perfil.id})}" method="post" style="display: inline;">
                                                    <button type="submit" class="btn btn-confirmar">SÍ, ELIMINAR</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Mensaje cuando no hay perfiles -->
                <div th:if="${#lists.isEmpty(perfiles)}" class="text-center mt-4">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No hay perfiles registrados en el sistema.
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
