<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Detalle del Perfil</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div th:replace="menú/sidebar :: sidebar"></div> 

        <div class="main-content">
            <div class="form-container">
                <h4 class="form-title">
                    <i class="fa-solid fa-user-tag"></i> DETALLE DEL PERFIL
                </h4>

                <!-- Botones de navegación -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="/perfiles" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver a la lista
                    </a>
                    <div>
                        <a th:href="@{/perfiles/{id}/editar(id=${perfil.id})}" class="btn btn-outline-warning me-2">
                            <i class="fas fa-pen"></i> Editar
                        </a>
                        <button type="button"
                                class="btn btn-outline-dark"
                                data-bs-toggle="modal"
                                data-bs-target="#modalEliminar">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </div>
                </div>

                <!-- Información principal del perfil -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="fas fa-info-circle"></i> Información Básica</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ID del Perfil:</label>
                                    <p th:text="${perfil.id}" class="form-control-plaintext"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nombre del Perfil:</label>
                                    <p th:text="${perfil.nombrePerfil}" class="form-control-plaintext"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Fecha de Creación:</label>
                                    <p class="form-control-plaintext text-muted">
                                        <i class="fas fa-calendar-alt"></i> Información no disponible
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header">
                                <h6 class="mb-0"><i class="fas fa-user-shield"></i> Rol Asignado</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">ID del Rol:</label>
                                    <p th:text="${perfil.rol.id}" class="form-control-plaintext"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nombre del Rol:</label>
                                    <p th:text="${perfil.rol.nombreRol}" class="form-control-plaintext"></p>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Estado:</label>
                                    <span class="badge bg-success">
                                        <i class="fas fa-check-circle"></i> Activo
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            

                <!-- Modal de confirmación para eliminar -->
                <div class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">
                                    <i class="fas fa-exclamation-triangle text-warning"></i>
                                    ¿Confirmar eliminación?
                                </h5>
                            </div>
                            <div class="modal-body">
                                <p>¿Está seguro de que desea eliminar este perfil?</p>
                                <div class="alert alert-warning">
                                    <strong>Perfil:</strong> <span th:text="${perfil.nombrePerfil}"></span><br>
                                    <strong>Rol:</strong> <span th:text="${perfil.rol.nombreRol}"></span>
                                </div>
                                <p class="text-danger">
                                    <i class="fas fa-warning"></i>
                                    <strong>Advertencia:</strong> Esta acción no se puede deshacer.
                                </p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <i class="fas fa-times"></i> Cancelar
                                </button>
                                <form th:action="@{/perfiles/{id}/eliminar(id=${perfil.id})}" method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-danger">
                                        <i class="fas fa-trash"></i> Eliminar Perfil
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
