<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Roles</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div th:replace="~{menú/sidebar :: sidebar}"></div> 

        <div class="main-content">
            <div class="container-fluid px-3 py-4">
                <!-- Mensajes de éxito/error -->
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Header responsive -->
                <div class="row align-items-center mb-4">
                    <div class="col-12 col-md-8">
                        <h4 class="form-title m-0">
                            <i class="fa-solid fa-user-shield"></i> LISTA DE ROLES
                        </h4>
                    </div>
                    <div class="col-12 col-md-4 mt-3 mt-md-0">
                        <a href="/roles/nuevo" class="btn custom-btn-accion w-100 w-md-auto">
                            <i class="fa-solid fa-plus me-2"></i>
                            <span class="d-none d-sm-inline">NUEVO ROL</span>
                            <span class="d-sm-none">NUEVO</span>
                        </a>
                    </div>
                </div>

                <!-- Tabla responsive -->
                <div class="table-responsive">
                    <table class="table tabla-usuarios">
                        <thead>
                            <tr>
                                <th class="d-none d-md-table-cell">ID</th>
                                <th>Nombre del Rol</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rol : ${roles}">
                                <td class="d-none d-md-table-cell" th:text="${rol.id}"></td>
                                <td>
                                    <div>
                                        <strong th:text="${rol.nombreRol}"></strong>
                                        <small class="text-muted d-block d-md-none">ID: [[${rol.id}]]</small>
                                    </div>
                                </td>
                                <td class="text-center">
                            <div class="dropdown">
                                <button class="btn btn-dark btn-sm rounded-circle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-solid fa-ellipsis-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/roles/{id}/editar(id=${rol.id})}">
                                            <i class="fa-solid fa-pen text-primary"></i> Editar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item btn-eliminar" href="javascript:void(0)"
                                            th:attr="data-id=${rol.id}, data-nombre=${rol.nombreRol}">
                                            <i class="fa-solid fa-trash text-danger"></i> Eliminar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/roles/{id}(id=${rol.id})}">
                                            <i class="fa-solid fa-eye text-info"></i> Ver detalles
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Mensaje cuando no hay roles -->
                <div th:if="${#lists.isEmpty(roles)}" class="text-center mt-4">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No hay roles registrados en el sistema.
                    </div>
                </div>
            </div>
        </div>

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Scripts de mensajes -->
        <script th:if="${mensaje}">
            Swal.fire({
                title: '¡Éxito!',
                text: /*[[${mensaje}]]*/ 'Operación realizada satisfactoriamente',
                icon: 'success',
                confirmButtonText: 'Aceptar',
                confirmButtonColor: "#b8922f"
            })
        </script>
        
        <script th:if="${error}">
            Swal.fire({
                title: 'Error',
                text: /*[[${error}]]*/ 'Ocurrió un error',
                icon: 'error',
                confirmButtonText: 'Aceptar',
                confirmButtonColor: "#d33"
            })
        </script>
        
        <script>
        // Event listener para botones de eliminar
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.btn-eliminar').forEach(button => {
                button.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const nombreRol = this.getAttribute('data-nombre');
                    confirmarEliminar(id, nombreRol);
                });
            });
        });

        // Función para confirmar eliminación de rol
        async function confirmarEliminar(id, nombreRol) {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                html: `<strong>Rol: ${nombreRol}</strong><br><br>No podrás deshacer esta acción.<br><br><strong>⚠️ Advertencia:</strong> Si este rol está siendo usado por algún perfil, la eliminación podría fallar.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#b8922f',
                cancelButtonColor: '#0A0A0A',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!result.isConfirmed) return;

            try {
                const response = await fetch(`/roles/${id}/eliminar`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (response.ok) {
                    Swal.fire({
                        title: '¡Eliminado!',
                        text: 'El rol ha sido eliminado con éxito.',
                        icon: 'success',
                        confirmButtonColor: '#0A0A0A',  // negro
                        confirmButtonText: 'OK'
                    }).then(() => location.reload());
                } else {
                    Swal.fire({
                        title: 'Error',
                        text: 'No se puede eliminar el rol porque está asignado a un usuario.',
                        icon: 'error',
                        confirmButtonColor: '#0A0A0A'
                    });
                }
            } catch (error) {
                Swal.fire({
                    title: 'Error',
                    text: 'Ocurrió un problema al intentar eliminar.',
                    icon: 'error',
                    confirmButtonColor: '#0A0A0A'
                });
            }
        }
    </script>

        
    </body>
</html>
