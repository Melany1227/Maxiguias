<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">


    <style>
        body {
            background-color: #fff;
            color: #000;
            font-family: Arial, sans-serif;
        }

        .card {
            border-radius: 1rem;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }

        .btn-custom {
            border-radius: 50px;
            padding: 6px 18px;
        }

        .table th {
            text-align: center;
            vertical-align: middle;
        }

        .table td {
            vertical-align: middle;
        }

        img {
            border-radius: 10px;
            border: 1px solid #ddd;
            padding: 4px;
            background: white;
        }

        .table-dark thead {
            background-color: #444;
            color: #fff;
        }

        .dropdown-toggle::after {
            display: none; /* oculta flechita del dropdown */
        }

         .btn-nuevoProducto {
            background-color: black;
            color: #d0a736;
            border-radius: 20px;
            padding: 6px 18px;
            font-weight: bold;
            border: none;
        }
    </style>
</head>
<body class="container py-5">

    <div class="card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold text-dark">Gestión de Productos</h2>
            <a href="/productos/nuevo" class="btn-nuevoProducto">
                + Nuevo Producto
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Código Producto</th>
                        <th>Nombre</th>
                        <th>Cantidad</th>
                        <th>Imagen</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.id}"></td>
                        <td class="fw-semibold" th:text="${producto.nombre}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${producto.cantidadDisponible}"></span>
                        </td>
                        <td>
                            <img th:src="@{${producto.imagen}}" alt="Imagen"
                                 style="width: 70px; height: auto;">
                        </td>
                        <td>
                            <!-- Dropdown con ícono -->
                            <div class="dropdown">
                                <button class="btn btn-dark btn-sm rounded-circle" type="button" 
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-three-dots-vertical"></i>
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item" 
                                           th:href="@{/productos/{id}/editar(id=${producto.id})}">
                                           <i class="bi bi-pencil-square text-primary"></i> Editar
                                        </a>
                                    </li>
                                    <li>
                                        <li>
                                            <a class="dropdown-item" href="javascript:void(0)"
                                            th:onclick="'confirmarEliminar(' + ${producto.id} + ');'">
                                            <i class="bi bi-trash text-danger"></i> Eliminar
                                            </a>
                                        </li>
                                        
                                    </li>
                                    <li>
                                        <a class="dropdown-item" href="#" 
                                           th:attr="data-bs-toggle='modal', data-bs-target='#detalleModal-' + ${producto.id}">
                                           <i class="bi bi-eye text-info"></i> Ver Detalles
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modales de detalle -->
    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'detalleModal-' + ${producto.id}" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Detalles de [[${producto.nombre}]]</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Medida</th>
                                    <th>Precio Público</th>
                                    <th>Precio x Mayor</th>
                                    <th>Precio x Encargo</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${producto.terminados}">
                                    <td th:text="${t.medidaTerminadoProducto}"></td>
                                    <td th:text="${t.precioPublico}"></td>
                                    <td th:text="${t.precioPorMayor}"></td>
                                    <td th:text="${t.precioPorEncargo}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>

    async function confirmarEliminar(id) {
        const result = await Swal.fire({
            title: '¿Estás seguro?',
            text: "No podrás deshacer esta acción",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, eliminar',
            confirmButtonColor: "#b8922f",
            cancelButtonText: 'Cancelar',
            confirmButtonColor: "#000000"
        });

        if (!result.isConfirmed) {
            return; 
        }

        try {
            const response = await fetch(`/productos/${id}/eliminar`, {
                method: 'DELETE',
                  headers: {
                'X-Requested-With': 'XMLHttpRequest',
    
            }
        });
            console.log("Código de respuesta:", response.status);

            if (response.ok) {
                Swal.fire(
                    '¡Eliminado!',
                    'El producto ha sido eliminado con éxito.',
                    'success'
                ).then(() => location.reload());
            } else {
                // Leer el texto de error del backend si lo hay
                const errorText = await response.text();
                console.error("Error al eliminar:", errorText);

                Swal.fire(
                    'Error',
                    `No se pudo eliminar el producto. Código: ${response.status}`,
                    'error'
                );
            }
        } catch (error) {
            console.error("Excepción atrapada:", error);

            Swal.fire(
                'Error',
                'Ocurrió un problema al intentar eliminar. Revisa la consola.',
                'error'
            );
        }
    }
</script>

<script th:if="${mensaje}">
    Swal.fire({
        title: '¡Éxito!',
        text: 'Producto creado satisfactoriamente',
        icon: 'success',
        confirmButtonText: 'Aceptar',
        confirmButtonColor: "#b8922f"

    })
</script>


</body>
</html>
