<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
 <style>
       

    </style>


</head>
<body>
    <!-- Sidebar -->
   <div th:replace="menú/sidebar :: sidebar"></div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="form-container">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="form-title m-0">
                    <i ></i> GESTIÓN DE PRODUCTOS
                </h4>
            </div>

            <!-- Buscador -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <form th:action="@{/productos}" method="get" class="d-flex">
                        <input type="text" name="keyword" th:value="${keyword}" 
                            placeholder="Buscar por código o nombre" 
                            class="form-control me-2"/>
                        <button type="submit" class="btn btn-dark">Buscar</button>
                    </form>

                

                    <a href="/productos/nuevo" class="btn btn-black-yellow text-decoration-none fw-bold">
                        <i class="bi bi-plus-circle me-2"></i> NUEVO PRODUCTO
                    </a>

          

                 
            
                </div>
            </div>
 

            <!-- Tabla -->
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Código Producto</th>
                            <th>Nombre</th>
                            <th>Imagen</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="producto : ${productos}">
                            <td th:text="${producto.id}"></td>
                            <td class="fw-semibold" th:text="${producto.nombre}"></td>
                            <td>
                                <img th:src="@{${producto.imagen}}" alt="Imagen"
                                     style="width: 70px; height: auto;">
                            </td>
                            <td>
                                <!-- Dropdown con ícono -->
                                <div class="dropdown">
                                    <button class="btn btn-dark btn-sm rounded-circle" type="button" 
                                            data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li>
                                            <a class="dropdown-item" 
                                               th:href="@{/productos/{id}/editar(id=${producto.id})}">
                                               <i class="fa-solid fa-pen text-primary"></i> Editar
                                            </a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" href="javascript:void(0)"
                                            th:onclick="'confirmarEliminar(' + ${producto.id} + ');'">
                                            <i class="fa-solid fa-trash text-danger"></i> Eliminar
                                            </a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" href="#" 
                                               th:attr="data-bs-toggle='modal', data-bs-target='#detalleModal-' + ${producto.id}">
                                               <i class="fa-solid fa-eye text-info"></i> Ver Detalles
                                            </a>
                                        </li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modales de detalle -->
    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'detalleModal-' + ${producto.id}" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Detalles de [[${producto.nombre}]]</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <table class="table table-bordered">
                            <thead>
                                <tr>
                                    <th>Medida</th>
                                    <th>Precio Público</th>
                                    <th>Precio x Mayor</th>
                                    <th>Precio x Encargo</th>
                                    <th>% Ganancia x Mayor</th>
                                    <th>% Ganancia x Encargo</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${producto.terminados}">
                                    <td th:text="${t.medidaTerminadoProducto}"></td>
                                    <td th:text="${t.precioPublico}"></td>
                                    <td th:text="${t.precioPorMayor}"></td>
                                    <td th:text="${t.precioPorEncargo}"></td>
                                    <td th:text="${t.gananciaXMayor}"><span class="input-group-text">%</span></td>
                                    <td th:text="${t.gananciaXEncargo}"><span class="input-group-text">%</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap y scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
    async function confirmarEliminar(id) {
        const result = await Swal.fire({
            title: '¿Estás seguro?',
            text: "No podrás deshacer esta acción",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        });

        if (!result.isConfirmed) {
            return; 
        }

        try {
            const response = await fetch(`/productos/${id}/eliminar`, {
                method: 'DELETE',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                }
            });

            if (response.ok) {
                Swal.fire(
                    '¡Eliminado!',
                    'El producto ha sido eliminado con éxito.',
                    'success'
                ).then(() => location.reload());
            } else {
                const errorText = await response.text();
                Swal.fire(
                    'Error',
                    `No se pudo eliminar el producto. Código: ${response.status}`,
                    'error'
                );
            }
        } catch (error) {
            Swal.fire(
                'Error',
                'Ocurrió un problema al intentar eliminar.',
                'error'
            );
        }
    }
    </script>

    <script th:if="${mensaje}">
        Swal.fire({
            title: '¡Éxito!',
            text: 'Producto creado satisfactoriamente',
            icon: 'success',
            confirmButtonText: 'Aceptar',
            confirmButtonColor: "#b8922f"
        })
    </script>

</body>
</html>
