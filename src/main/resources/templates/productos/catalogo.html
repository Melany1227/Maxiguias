<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>


<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <img src="/img/logo.png" alt="Logo MXG">
        <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> INICIO</a>
           <!-- <a href="/productos/juridico" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO Juridico</a>-->
        <a href="/productos/publico">Catálogo público</a>

        <!-- Solo visible si el usuario es jurídico -->
        <th:block th:if="${rolUsuario == 'JURIDICO'}">
            <a href="/productos/juridico">Catálogo jurídico</a>
        </th:block>
    </div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="container my-5">
            <h2 class="text-center mb-5">Catálogo de Productos</h2>
            <div class="row g-2">
                <!-- Iterar productos -->
                <div class="col-md-4" th:each="producto : ${productos}">
                    <div class="card h-100">
                        <img th:src="${producto.imagen != null and !producto.imagen.isEmpty() ? @cloudinaryService.getImageUrl(producto.imagen) : 'https://via.placeholder.com/400x300/cccccc/666666?text=Sin+Imagen'}" 
                             class="card-img-top" 
                             th:alt="${producto.nombre}" 
                             style="height:200px; object-fit:cover;"
                             onerror="if(this.src!='https://via.placeholder.com/400x300/cccccc/666666?text=Error'){this.src='https://via.placeholder.com/400x300/cccccc/666666?text=Error'}">
                        <div class="card-body text-center">
                            <h5 class="card-title" th:text="${producto.nombre}"></h5>

                            <!-- Mostrar solo primer terminado con precio público -->
                            <p th:if="${!producto.terminados.isEmpty()}" 
                               th:text="'Precio $' + ${producto.terminados[0].precioPublico}"></p>

                            <!-- Botón para ver detalles -->
                            <button class="btn btn-dark px-4 py-2 mt-2" 
                                    data-bs-toggle="modal" 
                                    th:data-bs-target="'#modal'+${producto.id}">
                                Ver más
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal por producto -->
    <div th:each="producto : ${productos}">
        <div class="modal fade" th:id="'modal'+${producto.id}" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" th:text="${producto.nombre}"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                 <div class="modal-body">

                    <!-- Imagen del producto con ajuste proporcional -->
                    <img th:src="${producto.imagen != null and !producto.imagen.isEmpty() ? 
                                 @cloudinaryService.getImageUrl(producto.imagen) : 
                                 'https://via.placeholder.com/600x400/cccccc/666666?text=Sin+Imagen'}"
                         class="img-fluid rounded mb-3"
                         th:alt="${producto.nombre}"
                         style="max-width: 100%; height: auto; max-height: 400px; object-fit: contain; margin: 0 auto; display: block;"
                         onerror="if(this.src!='https://via.placeholder.com/600x400/cccccc/666666?text=Error'){this.src='https://via.placeholder.com/600x400/cccccc/666666?text=Error'}">

                    <!-- Tabla de precios 
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Medida</th>
                                <th>Precio</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="t : ${producto.terminados}">
                                <td th:text="${t.medidaTerminadoProducto}"></td>
                                <td th:text="'$' + ${t.precioPublico}"></td>
                            </tr>
                        </tbody>
                    </table>-->
                    
  <table class="table table-hover align-middle">
    <thead class="table-dark">
        <tr>
            <th>Medida</th>
            <th th:if="${rolUsuario == 'PUBLICO'}">Precio Público</th>
            <th th:if="${rolUsuario == 'JURIDICO'}">Precio x Mayor</th>
            <th th:if="${rolUsuario == 'JURIDICO'}">Precio x Encargo</th>
            <th th:if="${rolUsuario == 'JURIDICO'}">Ganancia x Mayor</th>
            <th th:if="${rolUsuario == 'JURIDICO'}">Ganancia x Encargo</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="t : ${producto.terminados}">
            <td th:text="${t.medidaTerminadoProducto}"></td>

            <!-- Vista para público -->
            <td th:if="${rolUsuario == 'PUBLICO'}" th:text="'$' + ${t.precioPublico}"></td>

            <!-- Vista para jurídico -->
            <td th:if="${rolUsuario == 'JURIDICO'}" th:text="'$' + ${t.precioPorMayor}"></td>
            <td th:if="${rolUsuario == 'JURIDICO'}" th:text="'$' + ${t.precioPorEncargo}"></td>
            <td th:if="${rolUsuario == 'JURIDICO'}" th:text="${t.gananciaXMayor != null ? t.gananciaXMayor + '%' : '-'}"></td>
            <td th:if="${rolUsuario == 'JURIDICO'}" th:text="${t.gananciaXEncargo != null ? t.gananciaXEncargo + '%' : '-'}"></td>
        </tr>
    </tbody>
</table>



                </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
