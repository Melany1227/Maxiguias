<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        

    </style>
</head>

<body>
    <!-- Sidebar -->

<div class="sidebar">
        <img src="/img/logo.png" alt="Logo MXG">
        <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> INICIO</a>
        <a href="/productos/catalogo" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO</a>
        <a href="/usuarios" class="btn"><i class="bi bi-receipt"></i> USUARIOS</a>
        <a href="/ordenes" class="btn"><i class="bi bi-receipt"></i> ORDENES</a>
        <a href="/productos" class="btn"><i class="bi bi-box-seam"></i> PRODUCTOS</a>
    </div>

    

    <!-- === Contenido principal === -->
    <div class="main-content">
        <div class="card shadow-lg p-4 rounded-4">
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <h2 class="mb-4" th:text="${producto.id == null ? 'Registrar Nuevo Producto' : 'Editar Producto'}"></h2>

            <form th:action="${producto.id == null} ? @{/productos/nuevo} : @{/productos/{id}(id=${producto.id})}"
                  th:object="${producto}" method="post" class="mt-3" enctype="multipart/form-data">

                <!-- Datos Generales -->
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Código del producto</label>
                        <input type="number" th:field="*{id}" class="form-control" required 
                               th:disabled="${producto.id != null}"
                               onkeydown="return event.key !== 'e' && event.key !== 'E' && event.key !== '+' && event.key !== '-';" />
                        <input type="hidden" th:if="${producto.id != null}" th:field="*{id}" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Imagen del Producto</label>
                        <input type="file" name="imagenFile" class="form-control" accept="image/*" onchange="previewImage(this)" />
                        <small class="text-muted">Formatos: JPG, PNG, GIF (máx. 5MB)</small>
                    </div>
                    <div class="col-md-3" th:if="${producto.imagen}">
                        <label class="form-label">Imagen Actual</label>
                        <div>
                            <img th:src="${producto.imagen}" alt="Imagen del producto" style="max-width: 100px; max-height: 100px; object-fit: cover;" class="img-thumbnail" />
                        </div>
                    </div>
                </div>

                <!-- Terminados -->
                <h4 class="mt-4">Terminados</h4>
                <table class="table table-bordered mt-2">
                    <thead class="table-dark">
                        <tr>
                            <th>Medida</th>
                            <th>Precio Público</th>
                            <th>Precio x Mayor</th>
                            <th>Precio x Encargo</th>
                            <th>% Ganancia x Mayor</th>
                            <th>% Ganancia x Encargo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="terminadosTable">
                        <tr th:each="terminado, iterStat : *{terminados}">
                            <td><input type="number" step="0.01" th:field="*{terminados[__${iterStat.index}__].medidaTerminadoProducto}" class="form-control" required /></td>
                            <td><input type="number" th:field="*{terminados[__${iterStat.index}__].precioPublico}" class="form-control" required /></td>
                            <td><input type="number" th:field="*{terminados[__${iterStat.index}__].precioPorMayor}" class="form-control" required /></td>
                            <td><input type="number" th:field="*{terminados[__${iterStat.index}__].precioPorEncargo}" class="form-control" required /></td>
                            <td><input type="number" step="0.01" th:field="*{terminados[__${iterStat.index}__].gananciaXMayor}" class="form-control" /></td>
                            <td><input type="number" step="0.01" th:field="*{terminados[__${iterStat.index}__].gananciaXEncargo}" class="form-control" /></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">X</button></td>
                        </tr>
                    </tbody>
                </table>
                <button type="button" class="btn-black-yellow" onclick="agregarFila()">+ Agregar Terminado</button>

                <!-- Botones -->
                <div class="mt-4">
                    <button type="submit" class="btn-black-yellow">Guardar</button>
                    <a href="/productos" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        function agregarFila() {
            let tbody = document.getElementById("terminadosTable");
            let index = tbody.rows.length;
            let row = tbody.insertRow();
            row.innerHTML = `
                <td><input type="number" step="0.01" name="terminados[${index}].medidaTerminadoProducto" class="form-control" required /></td>
                <td><input type="number" name="terminados[${index}].precioPublico" class="form-control" required /></td>
                <td><input type="number" name="terminados[${index}].precioPorMayor" class="form-control" required /></td>
                <td><input type="number" name="terminados[${index}].precioPorEncargo" class="form-control" required /></td>
                <td><input type="number" step="0.01" name="terminados[${index}].gananciaXMayor" class="form-control" /></td>
                <td><input type="number" step="0.01" name="terminados[${index}].gananciaXEncargo" class="form-control" /></td>
                <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">X</button></td>
            `;
        }

        function eliminarFila(btn) {
            btn.closest("tr").remove();
        }

        document.addEventListener("DOMContentLoaded", function () {
            let mensaje = /*[[${mensaje}]]*/ null;
            if (mensaje) {
                Swal.fire({
                    title: "¡Éxito!",
                    text: mensaje,
                    icon: "success",
                    confirmButtonColor: "#d0a736"
                });
            }

            let error = /*[[${error}]]*/ null;
            if (error) {
                Swal.fire({
                    title: "Error",
                    text: error,
                    icon: "error",
                    confirmButtonColor: "#d0a736"
                });
            }
        }); 
        
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Crear preview si no existe
                    let preview = document.getElementById('imagePreview');
                    if (!preview) {
                        preview = document.createElement('div');
                        preview.id = 'imagePreview';
                        preview.innerHTML = '<label class="form-label">Vista Previa</label><br><img id="previewImg" style="max-width: 100px; max-height: 100px; object-fit: cover;" class="img-thumbnail" />';
                        input.parentNode.parentNode.appendChild(preview);
                    }
                    document.getElementById('previewImg').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
