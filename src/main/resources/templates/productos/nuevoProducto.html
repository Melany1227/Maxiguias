<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title th:text="${producto.id == null ? 'Nuevo Producto' : 'Editar Producto'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

    </style>
</head>

<body>
    <!-- Sidebar -->
    <div th:replace="menú/sidebar :: sidebar"></div>

    <!-- Contenido principal -->
    <div class="main-content">
        <div class="form-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-box"></i>
                    <span th:text="${producto.id == null ? 'Registrar Nuevo Producto' : 'Editar Producto'}"></span>
                </h4>
                <a href="/productos" class="btn-black-yellow">
                    <i class=></i> Volver
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensajeEdicion}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${mensajeEdicion}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:utext="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario -->
            <form th:action="${producto.id == null} ? @{/productos/nuevo} : @{/productos/{id}(id=${producto.id})}"
                  th:object="${producto}" method="post" class="mt-3" enctype="multipart/form-data">
                <!-- Campo oculto para registrar terminados eliminados -->
                <input type="hidden" id="terminadosEliminados" name="terminadosEliminados" />

                <!-- Datos generales -->
                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Código del producto</label>
                        <input type="number" th:field="*{id}" class="form-control" required
                            th:classappend="${errorCodigo} ? 'is-invalid' : ''" th:disabled="${producto.id != null}"
                            onkeydown="return event.key !== ',' && event.key !== '.' && event.key !== 'e' && event.key !== 'E' && event.key !== '+' && event.key !== '-';" />

                        <div class="invalid-feedback" th:if="${errorCodigo}" th:text="${errorCodigo}"></div>

                        <input type="hidden" th:if="${producto.id != null}" th:field="*{id}" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Imagen del Producto</label>
                        <input type="file" name="imagenFile" class="form-control" accept="image/*"
                            onchange="previewImage(this)" />
                        <small class="text-muted">Formatos: JPG, PNG, GIF (máx. 5MB)</small>
                    </div>


                    <div class="col-md-3" th:if="${producto.imagen}">
                        <label class="form-label">Imagen Actual</label>
                        <div>
                            <img th:src="${@cloudinaryService.getImageUrl(producto.imagen)}" alt="Imagen del producto"
                                style="max-width: 100px; max-height: 100px; object-fit: cover;" class="img-thumbnail" />
                        </div>
                    </div>
                </div>
                <!-- Tabla de terminados -->
                 <div>
                      <h4 class="mt-4">Terminados</h4>
                <button type="button" class="btn-black-yellow mt-2" onclick="agregarFila()">
                    <i ></i> Agregar Terminado
                </button>

                <div class="table-responsive">
                    <table class="mt-2 table table-terminados">
                        <thead class="table-dark">
                            <tr>
                                <th>Medida</th>
                                <th>Precio Público</th>
                                <th>Precio x Mayor</th>
                                <th>Precio x Encargo</th>
                                <th>% Ganancia x Mayor</th>
                                <th>% Ganancia x Encargo</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="terminadosTable">
                            <tr th:each="terminado, iterStat : *{terminados}" th:data-id="${terminado.id}">
                                <input type="hidden" th:field="*{terminados[__${iterStat.index}__].id}" class="terminado-id" />
                                <td><input type="number" step="0.01" th:field="*{terminados[__${iterStat.index}__].medidaTerminadoProducto}" class="form-control" required /></td>
                                <td><input type="number" th:field="*{terminados[__${iterStat.index}__].precioPublico}" class="form-control" required /></td>
                                <td><input type="number" th:field="*{terminados[__${iterStat.index}__].precioPorMayor}" class="form-control" required /></td>
                                <td><input type="number" th:field="*{terminados[__${iterStat.index}__].precioPorEncargo}" class="form-control" required /></td>
                                <td><input type="number" step="0.01" th:field="*{terminados[__${iterStat.index}__].gananciaXMayor}" class="form-control" /></td>
                                <td><input type="number" step="0.01" th:field="*{terminados[__${iterStat.index}__].gananciaXEncargo}" class="form-control" /></td>
                                <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)"><i class="bi bi-x-lg"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Botones finales -->
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn-black-yellow">
                        <i></i> Guardar
                    </button>

                    <div class="table-responsive">
                        <table class="mt-2 table table-terminados">
                            <thead class="table-dark">
                                <tr>
                                    <th>Medida</th>
                                    <th>Precio Público</th>
                                    <th>Precio x Mayor</th>
                                    <th>Precio x Encargo</th>
                                    <th>% Ganancia x Mayor</th>
                                    <th>% Ganancia x Encargo</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="terminadosTable">
                                <tr th:each="terminado, iterStat : *{terminados}">
                                    <td><input type="text" step="0.01"
                                            th:field="*{terminados[__${iterStat.index}__].medidaTerminadoProducto}"
                                            class="form-control numero-estricto" required /></td>
                                    <td><input type="number"
                                            th:field="*{terminados[__${iterStat.index}__].precioPublico}"
                                            class="form-control numero-estricto" required /></td>
                                    <td><input type="number"
                                            th:field="*{terminados[__${iterStat.index}__].precioPorMayor}"
                                            class="form-control numero-estricto" required /></td>
                                    <td><input type="number"
                                            th:field="*{terminados[__${iterStat.index}__].precioPorEncargo}"
                                            class="form-control numero-estricto" required /></td>
                                    <td><input type="text" step="0.01"
                                            th:field="*{terminados[__${iterStat.index}__].gananciaXMayor}"
                                            class="form-control numero-estricto" /></td>
                                    <td><input type="text" step="0.01"
                                            th:field="*{terminados[__${iterStat.index}__].gananciaXEncargo}"
                                            class="form-control numero-estricto" /></td>
                                    <td><button type="button" class="btn btn-danger btn-sm"
                                            onclick="eliminarFila(this)"><i class="bi bi-x-lg"></i></button></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Botones finales -->
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn-black-yellow">
                            <i></i> Guardar
                        </button>
                        <a href="/productos" class="btn-black-yellow">
                            <i></i> Cancelar
                        </a>
                    </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script th:inline="javascript">
        // Almacenar los IDs de terminados eliminados
        let terminadosEliminados = [];

        function agregarFila() {
            let tbody = document.getElementById("terminadosTable");
            let index = tbody.rows.length;
            let row = tbody.insertRow();
            row.innerHTML = `
                <input type="hidden" name="terminados[${index}].id" value="" />
                <td><input type="number" step="0.01" name="terminados[${index}].medidaTerminadoProducto" class="form-control" required /></td>
                <td><input type="number" name="terminados[${index}].precioPublico" class="form-control" required /></td>
                <td><input type="number" name="terminados[${index}].precioPorMayor" class="form-control" required /></td>
                <td><input type="number" name="terminados[${index}].precioPorEncargo" class="form-control" required /></td>
                <td><input type="number" step="0.01" name="terminados[${index}].gananciaXMayor" class="form-control" /></td>
                <td><input type="number" step="0.01" name="terminados[${index}].gananciaXEncargo" class="form-control" /></td>
                <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)"><i class="bi bi-x-lg"></i></button></td>
            `;
        }

        function eliminarFila(btn) {
            let fila = btn.closest("tr");
            let idInput = fila.querySelector(".terminado-id");

            // Si tiene un ID (es un terminado existente), validar si está en uso
            if (idInput && idInput.value) {
                // Hacer petición AJAX para verificar si está en facturas
                fetch(`/terminados/${idInput.value}/en-uso`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.enUso) {
                            // Mostrar error si está en uso
                            Swal.fire({
                                icon: 'error',
                                title: 'No se puede eliminar',
                                text: 'Este terminado está siendo usado en facturas. Por favor, revise las órdenes asociadas.',
                                confirmButtonColor: '#d33',
                                confirmButtonText: 'Aceptar'
                            });
                        } else {
                            // Si no está en uso, pedir confirmación antes de eliminar
                            Swal.fire({
                                title: '¿Está seguro?',
                                text: 'Este terminado se eliminará definitivamente.',
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonColor: '#d33',
                                cancelButtonColor: '#6c757d',
                                confirmButtonText: 'Sí, eliminar',
                                cancelButtonText: 'Cancelar'
                            }).then((result) => {
                                if (result.isConfirmed) {
                                    // Confirmar eliminación
                                    terminadosEliminados.push(idInput.value);
                                    fila.remove();
                                    Swal.fire({
                                        title: 'Eliminado',
                                        text: 'El terminado ha sido eliminado.',
                                        icon: 'success',
                                        confirmButtonColor: '#b8922f'
                                    });
                                }
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: 'Error al validar el terminado.',
                            confirmButtonColor: '#d33',
                            confirmButtonText: 'Aceptar'
                        });
                    });
            } else {
                // Si no tiene ID, es un terminado nuevo, eliminar directamente
                fila.remove();
            }
        }

        // Antes de enviar el formulario, agregar los IDs de eliminados
        document.querySelector("form").addEventListener("submit", function(e) {
            document.getElementById("terminadosEliminados").value = terminadosEliminados.join(",");
        });

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    let preview = document.getElementById('imagePreview');
                    if (!preview) {
                        preview = document.createElement('div');
                        preview.id = 'imagePreview';
                        preview.innerHTML = '<label class="form-label mt-2">Vista Previa</label><br><img id="previewImg" style="max-width: 100px; max-height: 100px; object-fit: cover;" class="img-thumbnail" />';
                        input.parentNode.appendChild(preview);
                    }
                    document.getElementById('previewImg').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

    </script>

    <script th:inline="javascript" th:if="${errorCodigo}">
        Swal.fire({
            icon: 'error',
            title: 'Código duplicado',
            text: '[[${errorCodigo}]]',
            confirmButtonColor: '#b8922f',
            confirmButtonText: 'Aceptar'
        });


    </script>
    <script>
        // Función para aplicar restricción a todos los inputs con la clase .numero-estricto
        function aplicarRestriccionNumeros() {
            document.querySelectorAll('.numero-estricto').forEach(input => {
                input.addEventListener('keydown', function (e) {
                    const tecla = e.key;

                    // Permitir control (borrar, tab, navegación)
                    if (['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight'].includes(tecla)) {
                        return;
                    }

                    // Permitir solo números, punto y %
                    if (!/[0-9.%]/.test(tecla)) {
                        e.preventDefault();
                    }

                    // Evitar más de un punto decimal
                    if (tecla === '.' && this.value.includes('.')) {
                        e.preventDefault();
                    }

                    // Evitar más de un signo %
                    if (tecla === '%' && this.value.includes('%')) {
                        e.preventDefault();
                    }
                });
            });
        }

        // Aplicar al cargar la página
        document.addEventListener('DOMContentLoaded', aplicarRestriccionNumeros);

        // Reemplazamos tu función agregarFila con la versión extendida
        function agregarFila() {
            let tbody = document.getElementById("terminadosTable");
            let index = tbody.rows.length;
            let row = tbody.insertRow();
            row.innerHTML =
                '<td><input type="number" step="0.01" name="terminados[' + index + '].medidaTerminadoProducto" class="form-control numero-estricto" required /></td>' +
                '<td><input type="number" name="terminados[' + index + '].precioPublico" class="form-control numero-estricto" required /></td>' +
                '<td><input type="number" name="terminados[' + index + '].precioPorMayor" class="form-control numero-estricto" required /></td>' +
                '<td><input type="number" name="terminados[' + index + '].precioPorEncargo" class="form-control numero-estricto" required /></td>' +
                '<td><input type="text" step="0.01" name="terminados[' + index + '].gananciaXMayor" class="form-control numero-estricto" /></td>' +
                '<td><input type="text" step="0.01" name="terminados[' + index + '].gananciaXEncargo" class="form-control numero-estricto" /></td>' +
                '<td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)"><i class="bi bi-x-lg"></i></button></td>';

            // Reaplicar validación a los nuevos inputs
            aplicarRestriccionNumeros();
        }

        // Función para eliminar fila (igual que antes)
        function eliminarFila(btn) {
            btn.closest("tr").remove();
        }
    </script>



</body>

</html>
