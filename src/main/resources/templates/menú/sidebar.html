<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Sidebar Fragment -->
    <div class="sidebar" th:fragment="sidebar">
        <img src="/img/logo.png" alt="Logo MXG">

        <!-- Si NO está autenticado -->
        <div sec:authorize="!isAuthenticated()">
            <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> INICIO</a>
            <a href="/login" class="btn"><i class="bi bi-box-arrow-in-right"></i> INGRESAR</a>
            <a href="/productos/publico" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO</a>
        </div>

        <!-- Si está autenticado -->
        <div sec:authorize="isAuthenticated()">
            <p th:text="${nombreUsuarioActual}"
               style="color: white; margin: 10px 0; text-align: center; font-weight: bold;"></p>

            <!-- Todos los usuarios autenticados ven INICIO -->
            <a href="/" class="btn"><i class="bi bi-house-door-fill"></i> INICIO</a>

            <!-- Catálogo visible para ADMINISTRADOR y JURIDICO -->
            <a href="/productos/juridico" class="btn"
               sec:authorize="hasAuthority('ADMINISTRADOR') or hasAuthority('JURIDICO')">
               <i class="bi bi-journal-text"></i> CATÁLOGO
            </a>

            <!-- Toma de pedidos/órdenes para ADMINISTRADOR y JURIDICO -->
            <a href="/ordenes" class="btn"
               sec:authorize="hasAuthority('ADMINISTRADOR') or hasAuthority('JURIDICO')">
               <i class="bi bi-receipt"></i> ÓRDENES
            </a>

            <!-- Solo ADMINISTRADOR -->
            <div sec:authorize="hasAuthority('ADMINISTRADOR')">
                <a href="/usuarios" class="btn"><i class="bi bi-people-fill"></i> USUARIOS</a>
                <a href="/productos" class="btn"><i class="bi bi-box-seam"></i> PRODUCTOS</a>
                <a href="/perfiles" class="btn"><i class="bi bi-person-badge"></i> PERFILES</a>
                <a href="/roles" class="btn"><i class="bi bi-shield-lock"></i> ROLES</a>
                <a href="/departamentos" class="btn"><i class="bi bi-map"></i> DEPARTAMENTOS</a>
                <a href="/ciudades" class="btn"><i class="bi bi-building"></i> CIUDADES</a>
                <a href="/reportes" class="btn"><i class="bi bi-graph-up"></i> REPORTES</a>
            </div>

            <!-- Cerrar sesión -->
            <form th:action="@{/logout}" method="post" style="display: inline; width: 100%;">
                <button type="submit" class="btn"><i class="bi bi-box-arrow-right"></i> CERRAR SESIÓN</button>
            </form>
        </div>
    </div>
</body>
</html>
