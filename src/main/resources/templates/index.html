<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head>
    <meta charset="UTF-8">
    <title>MXG - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    </head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <img src="/img/logo.png" alt="Logo MXG">

        <!-- Si NO está autenticado -->
        <div sec:authorize="!isAuthenticated()">
            <a href="/login" class="btn"><i class="bi bi-box-arrow-in-right"></i> INGRESAR</a>
            <a href="/productos/catalogo" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO</a>
        </div>

        <!-- Si está autenticado -->
        <div sec:authorize="isAuthenticated()">
            <p sec:authentication="name" style="color: white; margin: 10px 0;"></p>
            <a href="/" class="btn active"><i class="bi bi-house-door-fill"></i> INICIO</a>
            <a href="/productos/catalogo" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO</a>
            <a href="/usuarios" class="btn"><i class="bi bi-people-fill"></i> USUARIOS</a>
            <a href="/ordenes" class="btn"><i class="bi bi-receipt"></i> ÓRDENES</a>
            <a href="/productos" class="btn"><i class="bi bi-box-seam"></i> PRODUCTOS</a>
            <a href="/perfiles" class="btn"><i class="bi bi-person-badge"></i> PERFILES</a>
            <a href="/roles" class="btn"><i class="bi bi-shield-check"></i> ROLES</a>
            <a href="/reportes" class="btn"><i class="bi bi-file-earmark-bar-graph"></i> REPORTES</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn"><i class="bi bi-box-arrow-right"></i> CERRAR SESIÓN</button>
            </form>
        </div>
    </div>

    <!-- Contenido -->
    <div class="main-content">
        <h1>Bienvenido a MaxiGestion</h1>
        <p>Hecho con ❤️ por estudiantes!</p>
    </div>
</body>
</html>
