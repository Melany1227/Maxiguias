<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Maxigestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
    <div class="layout">
        <!-- ===== SIDEBAR (con tu logo) ===== -->
        <div th:replace="menú/sidebar :: sidebar"></div>
    
        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <main class="main-content">
            <section class="card">
                <h1>CAMBIAR CONTRASEÑA</h1>

                <!-- Mensajes -->
                <div th:if="${mensajeModal}" th:class="${tipoMensaje == 'error' ? 'alert alert-danger' : 'alert alert-success'}">
                    <span th:text="${mensajeModal}"></span>
                </div>

                <form th:action="@{/cambiar-password}" method="post" class="form">
                    <div class="form-group">
                        <label for="correo">
                            <i class="fa-solid fa-envelope"></i> Correo Electrónico *
                        </label>
                        <input id="correo" name="correo" type="email" required 
                               placeholder="Ingresa tu correo electrónico" class="form-control" 
                               th:value="${correoPrelleno}" />
                    </div>

                    <div class="form-group">
                        <label for="contrasenaTemporal">
                            <i class="fa-solid fa-key"></i> Contraseña Temporal *
                        </label>
                        <div class="password-input-container">
                            <input id="contrasenaTemporal" name="contrasenaTemporal" type="password" required 
                                   placeholder="Contraseña temporal del correo" class="form-control" />
                            <button type="button" class="password-toggle" onclick="togglePassword('contrasenaTemporal')">
                                <i class="fa-solid fa-eye" id="eye-contrasenaTemporal"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="nuevaContrasena">
                            <i class="fa-solid fa-lock"></i> Nueva Contraseña *
                        </label>
                        <div class="password-input-container">
                            <input id="nuevaContrasena" name="nuevaContrasena" type="password" required 
                                   placeholder="Ingresa tu nueva contraseña" class="form-control" 
                                   minlength="6" />
                            <button type="button" class="password-toggle" onclick="togglePassword('nuevaContrasena')">
                                <i class="fa-solid fa-eye" id="eye-nuevaContrasena"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmarContrasena">
                            <i class="fa-solid fa-lock"></i> Confirmar Contraseña *
                        </label>
                        <div class="password-input-container">
                            <input id="confirmarContrasena" name="confirmarContrasena" type="password" required 
                                   placeholder="Confirma tu nueva contraseña" class="form-control" 
                                   minlength="6" />
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmarContrasena')">
                                <i class="fa-solid fa-eye" id="eye-confirmarContrasena"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-shield-halved"></i> CAMBIAR CONTRASEÑA
                    </button>
                    
                    <p class="hint">
                        <a th:href="@{/login}">← Volver al inicio de sesión</a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        let mensajeModal = /*[[${mensajeModal}]]*/ null;
        let tipoMensaje = /*[[${tipoMensaje}]]*/ null;
        let redirigirLogin = /*[[${redirigirLogin}]]*/ false;

        if (mensajeModal && mensajeModal !== 'null' && mensajeModal.trim() !== '') {
            const icono = tipoMensaje === 'error' ? 'error' : 'success';
            const titulo = tipoMensaje === 'error' ? 'Error' : '¡Éxito!';
            const color = tipoMensaje === 'error' ? '#d33' : '#b8922f';
            
            Swal.fire({
                title: titulo,
                text: mensajeModal,
                icon: icono,
                confirmButtonText: 'Aceptar',
                confirmButtonColor: color
            }).then(() => {
                if (redirigirLogin) {
                    window.location.href = '/login';
                }
            });
        }
        /*]]>*/

        // Función para mostrar/ocultar contraseñas
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const eyeIcon = document.getElementById('eye-' + inputId);
            
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Validación de contraseñas
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const nuevaContrasena = document.getElementById('nuevaContrasena');
            const confirmarContrasena = document.getElementById('confirmarContrasena');

            form.addEventListener('submit', function(e) {
                if (nuevaContrasena.value !== confirmarContrasena.value) {
                    e.preventDefault();
                    Swal.fire({
                        title: 'Error',
                        text: 'Las contraseñas no coinciden',
                        icon: 'error',
                        confirmButtonText: 'Aceptar',
                        confirmButtonColor: '#d33'
                    });
                }
            });

            // Validación en tiempo real
            confirmarContrasena.addEventListener('input', function() {
                if (nuevaContrasena.value !== confirmarContrasena.value) {
                    confirmarContrasena.setCustomValidity('Las contraseñas no coinciden');
                } else {
                    confirmarContrasena.setCustomValidity('');
                }
            });
        });
    </script>
</body>
</html>
