<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Maxigestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
    <div class="layout">
        <!-- ===== SIDEBAR (con tu logo) ===== -->
        <div th:replace="menú/sidebar :: sidebar"></div>
    
        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <main class="main-content">
            <section class="card">
                <h1>RECUPERAR CONTRASEÑA</h1>

                <!-- Mensajes -->
                <div th:if="${mensajeModal}" th:class="${tipoMensaje == 'error' ? 'alert alert-danger' : 'alert alert-success'}">
                    <span th:text="${mensajeModal}"></span>
                </div>

                <form th:action="@{/recuperar-password}" method="post" class="form">
                    <div class="form-group">
                        <label for="correo">
                            <i class="fa-solid fa-envelope"></i> Correo Electrónico
                        </label>
                        <input id="correo" name="correo" type="email" required 
                               placeholder="Ingresa tu correo electrónico" class="form-control" />
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="fa-solid fa-paper-plane"></i> ENVIAR ENLACE
                    </button>
                    
                    <p class="hint">
                        <a th:href="@{/login}">← Volver al inicio de sesión</a>
                    </p>
                </form>
            </section>
        </main>
    </div>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        let mensajeModal = /*[[${mensajeModal}]]*/ null;
        let tipoMensaje = /*[[${tipoMensaje}]]*/ null;

        if (mensajeModal && mensajeModal !== 'null' && mensajeModal.trim() !== '') {
            const icono = tipoMensaje === 'error' ? 'error' : 'success';
            const titulo = tipoMensaje === 'error' ? 'Error' : '¡Éxito!';
            const color = tipoMensaje === 'error' ? '#d33' : '#b8922f';
            
            Swal.fire({
                title: titulo,
                text: mensajeModal,
                icon: icono,
                confirmButtonText: 'Aceptar',
                confirmButtonColor: color
            });
        }
        /*]]>*/
    </script>
</body>
</html>
