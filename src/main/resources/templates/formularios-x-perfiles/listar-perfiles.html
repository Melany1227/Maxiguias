<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios x Perfiles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <div th:replace="menú/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="form-container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-lock"></i> FORMULARIOS X PERFILES
                </h4>
                <a href="/" class="btn" style="background-color: #000; color: white; border-left: 5px solid #f3c623;">
                    <i class="fa-solid fa-home"></i> Inicio
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-check-circle me-2"></i>
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Tabla de Perfiles -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th><i class="fa-solid fa-id-card me-2"></i>ID</th>
                            <th><i class="fa-solid fa-tag me-2"></i>Nombre del Perfil</th>
                            <th><i class="fa-solid fa-shield me-2"></i>Rol</th>
                            <th><i class="fa-solid fa-cog me-2"></i>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="perfil : ${perfiles}">
                            <td th:text="${perfil.id}"></td>
                            <td th:text="${perfil.nombrePerfil}"></td>
                            <td th:text="${perfil.rol.nombreRol}"></td>
                            <td>
                                <a th:href="@{/formularios-x-perfiles/{id}(id=${perfil.id})}"
                                   class="btn btn-sm"
                                   style="background-color: #f3c623; color: #000; border-left: 3px solid #000;">
                                    <i class="fa-solid fa-eye"></i> Ver Formularios
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(perfiles)}" class="alert alert-info">
                <i class="fa-solid fa-info-circle me-2"></i>
                No hay perfiles disponibles.
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
