<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Permisos del Formulario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <div th:replace="menú/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="form-container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-pen"></i> EDITAR PERMISOS
                </h4>
                <a th:href="@{/formularios-x-perfiles/{id}(id=${perfil.id})}"
                   class="btn"
                   style="background-color: #000; color: white; border-left: 5px solid #f3c623;">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </a>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card" style="border-left: 5px solid #f3c623;">
                        <div class="card-header bg-dark text-white">
                            <h5 class="mb-0"><i class="fa-solid fa-id-card me-2"></i>Perfil</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-2"><strong>Nombre:</strong> <span th:text="${perfil.nombrePerfil}"></span></p>
                            <p class="mb-0"><strong>Rol:</strong> <span th:text="${perfil.rol.nombreRol}"></span></p>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card" style="border-left: 5px solid #000;">
                        <div class="card-header text-white" style="background-color: #f3c623; color: #000 !important;">
                            <h5 class="mb-0 text-dark"><i class="fa-solid fa-file me-2"></i>Formulario</h5>
                        </div>
                        <div class="card-body">
                            <p class="mb-2"><strong>Nombre:</strong> <span th:text="${formulario.nombreFormulario}"></span></p>
                            <p class="mb-0"><strong>URL:</strong> <code th:text="${formulario.url}"></code></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Formulario de Permisos -->
            <form th:action="@{/formularios-x-perfiles/{perfilId}/editar/{formularioId}(perfilId=${perfil.id}, formularioId=${formulario.id})}"
                  method="post"
                  class="row g-3">

                <div class="col-12">
                    <h5 class="mt-4 mb-3"><i class="fa-solid fa-lock me-2"></i>Configurar Permisos</h5>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch" style="padding-left: 3rem;">
                        <input class="form-check-input" type="checkbox" id="crear" name="crear" value="S"
                               th:checked="${asignacion.crear == 'S'}">
                        <label class="form-check-label" for="crear">
                            <i class="fa-solid fa-plus me-2"></i><strong>Crear</strong>
                            <small class="d-block text-muted">Permite crear nuevos registros</small>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch" style="padding-left: 3rem;">
                        <input class="form-check-input" type="checkbox" id="editar" name="editar" value="S"
                               th:checked="${asignacion.editar == 'S'}">
                        <label class="form-check-label" for="editar">
                            <i class="fa-solid fa-pen me-2"></i><strong>Editar</strong>
                            <small class="d-block text-muted">Permite modificar registros</small>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch" style="padding-left: 3rem;">
                        <input class="form-check-input" type="checkbox" id="visualizar" name="visualizar" value="S"
                               th:checked="${asignacion.visualizar == 'S'}">
                        <label class="form-check-label" for="visualizar">
                            <i class="fa-solid fa-eye me-2"></i><strong>Visualizar</strong>
                            <small class="d-block text-muted">Permite ver registros</small>
                        </label>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-check form-switch" style="padding-left: 3rem;">
                        <input class="form-check-input" type="checkbox" id="eliminar" name="eliminar" value="S"
                               th:checked="${asignacion.eliminar == 'S'}">
                        <label class="form-check-label" for="eliminar">
                            <i class="fa-solid fa-trash me-2"></i><strong>Eliminar</strong>
                            <small class="d-block text-muted">Permite eliminar registros</small>
                        </label>
                    </div>
                </div>

                <!-- Botones -->
                <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                    <button type="submit" class="btn" style="background-color: #f3c623; color: #000; border-left: 5px solid #000;">
                        <i class="fa-solid fa-save"></i> GUARDAR CAMBIOS
                    </button>
                    <a th:href="@{/formularios-x-perfiles/{id}(id=${perfil.id})}"
                       class="btn"
                       style="background-color: #000; color: white; border-left: 5px solid #f3c623;">
                        <i class="fa-solid fa-times"></i> CANCELAR
                    </a>
                </div>
            </form>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Convertir checkboxes a formato esperado (S/N)
        document.querySelector('form').addEventListener('submit', function(e) {
            document.getElementById('crear').value = document.getElementById('crear').checked ? 'S' : 'N';
            document.getElementById('editar').value = document.getElementById('editar').checked ? 'S' : 'N';
            document.getElementById('visualizar').value = document.getElementById('visualizar').checked ? 'S' : 'N';
            document.getElementById('eliminar').value = document.getElementById('eliminar').checked ? 'S' : 'N';
        });
    </script>

</body>
</html>
