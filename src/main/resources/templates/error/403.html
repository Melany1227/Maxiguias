<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head>
    <meta charset="UTF-8">
    <title>MXG - Acceso Denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- Sidebar -->
    <div th:replace="~{menú/sidebar :: sidebar}"></div> 

    <!-- Contenido -->
    <div class="main-content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="alert alert-danger text-center">
                        <i class="bi bi-shield-x" style="font-size: 3rem; color: #dc3545;"></i>
                        <h3 class="mt-3">Acceso Denegado</h3>
                        <p class="mb-4">El usuario no cuenta con permisos para visualizar esta pantalla.</p>
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Redirección automática después de 5 segundos -->
    <script>
        setTimeout(function() {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
