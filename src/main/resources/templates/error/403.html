<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head>
    <meta charset="UTF-8">
    <title>MXG - Acceso Denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <img src="/img/logo.png" alt="Logo MXG">

        <!-- Si NO está autenticado -->
        <div sec:authorize="!isAuthenticated()">
            <a href="/login" class="btn"><i class="bi bi-box-arrow-in-right"></i> INGRESAR</a>
            <a href="/productos/catalogo" class="btn"><i class="bi bi-journal-text"></i> CATÁLOGO</a>
        </div>

        <!-- Si está autenticado -->
        <div sec:authorize="isAuthenticated()">
            <p sec:authentication="name" style="color: white; margin: 10px 0;"></p>
            <a href="/ordenes" class="btn"><i class="bi bi-receipt"></i> ORDENES</a>
            <a href="/productos" class="btn"><i class="bi bi-box-seam"></i> PRODUCTOS</a>
            <a href="/usuarios" class="btn"><i class="bi bi-people-fill"></i> USUARIOS</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn"><i class="bi bi-box-arrow-right"></i>CERRAR SESIÓN</button>
            </form>
        </div>
    </div>

    <!-- Contenido -->
    <div class="main-content">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="alert alert-danger text-center">
                        <i class="bi bi-shield-x" style="font-size: 3rem; color: #dc3545;"></i>
                        <h3 class="mt-3">Acceso Denegado</h3>
                        <p class="mb-4">El usuario no cuenta con permisos para visualizar esta pantalla.</p>
                        <a href="/" class="btn btn-primary">
                            <i class="bi bi-house-door"></i> Volver al Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Redirección automática después de 5 segundos -->
    <script>
        setTimeout(function() {
            window.location.href = '/';
        }, 5000);
    </script>
</body>
</html>
