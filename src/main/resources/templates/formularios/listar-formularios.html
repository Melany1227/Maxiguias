<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Formularios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <div th:replace="menú/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="form-container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-file"></i> ADMINISTRADOR DE FORMULARIOS
                </h4>
                <a href="/formularios/nuevo"
                   class="btn"
                   style="background-color: #f3c623; color: #000; border-left: 5px solid #000;">
                    <i class="fa-solid fa-plus"></i> Nuevo Formulario
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-check-circle me-2"></i>
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Tabla de Formularios -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th><i class="fa-solid fa-hashtag me-2"></i>ID</th>
                            <th><i class="fa-solid fa-file me-2"></i>Nombre</th>
                            <th><i class="fa-solid fa-link me-2"></i>URL</th>
                            <th style="text-align: center;"><i class="fa-solid fa-cog me-2"></i>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="formulario : ${formularios}">
                            <td th:text="${formulario.id}"></td>
                            <td th:text="${formulario.nombreFormulario}"></td>
                            <td>
                                <code th:text="${formulario.url}" style="font-size: 0.85rem;"></code>
                            </td>
                            <td style="text-align: center;">
                                <a th:href="@{/formularios/editar/{id}(id=${formulario.id})}"
                                   class="btn btn-sm btn-warning"
                                   title="Editar formulario">
                                    <i class="fa-solid fa-pen"></i>
                                </a>
                                <form th:action="@{/formularios/eliminar/{id}(id=${formulario.id})}"
                                      method="POST"
                                      style="display: inline;"
                                      onsubmit="return confirm('¿Está seguro de eliminar este formulario?\n\nSe eliminarán automáticamente todas las asignaciones de este formulario a los perfiles.');">
                                    <button type="submit" class="btn btn-sm btn-danger" title="Eliminar formulario">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(formularios)}" class="alert alert-info">
                <i class="fa-solid fa-info-circle me-2"></i>
                No hay formularios registrados.
                <a href="/formularios/nuevo">Crear uno</a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
