<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Formularios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <div th:replace="menú/sidebar :: sidebar"></div>

    <div class="main-content">
        <div class="form-container">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="form-title m-0">
                    <i class="fa-solid fa-file"></i> ADMINISTRADOR DE FORMULARIOS
                </h4>
                <a href="/formularios/nuevo" class="custom-btn-accion"
                    >
                    <i class="fa-solid fa-plus"></i> Nuevo Formulario
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-check-circle me-2"></i>
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Tabla de Formularios -->
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th><i class="fa-solid fa-hashtag me-2"></i>ID</th>
                            <th><i class="fa-solid fa-file me-2"></i>Nombre</th>
                            <th><i class="fa-solid fa-link me-2"></i>URL</th>
                            <th style="text-align: center;"><i class="fa-solid fa-cog me-2"></i>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="formulario : ${formularios}">
                            <td th:text="${formulario.id}"></td>
                            <td th:text="${formulario.nombreFormulario}"></td>
                            <td>
                                <code th:text="${formulario.url}" style="font-size: 0.85rem;"></code>
                            </td>
                            <td style="text-align: center;">
                                <div class="dropdown d-inline-block">
                                    <button class="btn btn-dark btn-sm rounded-circle" type="button"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end">
                                        <li>
                                            <a class="dropdown-item"
                                                th:href="@{/formularios/editar/{id}(id=${formulario.id})}">
                                                <i class="fa-solid fa-pen text-primary"></i> Editar
                                            </a>
                                        </li>
                                        <li>
                                            <form class="dropdown-item p-0 m-0 form-eliminar-formulario"
                                                th:action="@{/formularios/eliminar/{id}(id=${formulario.id})}"
                                                method="POST">
                                                <button type="button"
                                                    class="dropdown-item text-danger bg-transparent border-0 w-100 text-start btn-eliminar-formulario"
                                                    th:data-formulario-id="${formulario.id}"
                                                    th:data-formulario-nombre="${formulario.nombreFormulario}">
                                                    <i class="fa-solid fa-trash me-2"></i>Eliminar
                                                </button>
                                            </form>
                                        </li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(formularios)}" class="alert alert-info">
                <i class="fa-solid fa-info-circle me-2"></i>
                No hay formularios registrados.
                <a href="/formularios/nuevo">Crear uno</a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Manejar eliminación de formularios con SweetAlert2
            document.querySelectorAll('.btn-eliminar-formulario').forEach(button => {
                button.addEventListener('click', async function(e) {
                    e.preventDefault();
                    
                    const formularioId = this.getAttribute('data-formulario-id');
                    const formularioNombre = this.getAttribute('data-formulario-nombre');
                    
                    const result = await Swal.fire({
                        title: '¿Estás seguro?',
                        html: `<strong>Formulario: ${formularioNombre}</strong><br><br>
                               <div class="alert alert-warning" style="margin: 15px 0;">
                                   <i class="fa-solid fa-exclamation-triangle"></i> 
                                   Se eliminarán automáticamente todas las asignaciones de este formulario a los perfiles.
                               </div>
                               No podrás deshacer esta acción.`,
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#d33',
                        cancelButtonColor: '#3085d6',
                        confirmButtonText: 'Sí, eliminar',
                        cancelButtonText: 'Cancelar'
                    });
                    
                    if (result.isConfirmed) {
                        // Enviar el formulario
                        this.closest('form').submit();
                    }
                });
            });
        });
    </script>

</body>

</html>
