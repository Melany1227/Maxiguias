<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Lista de Ciudades</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/estilos.css}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div th:replace="~{menú/sidebar :: sidebar}"></div>

        <div class="main-content">
            <div class="form-container">
                <!-- Mensajes de éxito/error -->
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="fas fa-check-circle"></i> <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="form-title m-0">
                        <i class="fa-solid fa-city"></i> LISTA DE CIUDADES
                    </h4>

                    <a href="/ciudades/nuevo" class="custom-btn-accion">
                        <i class="fa-solid fa-plus" style="padding-right: 8px;"></i> NUEVA CIUDAD
                    </a>
                </div>

                <table class="table tabla-usuarios align-middle text-center">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre de la Ciudad</th>
                            <th>Departamento</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ciudad : ${ciudades}">
                            <td th:text="${ciudad.id}"></td>
                            <td th:text="${ciudad.nombre}"></td>
                            <td>
                                <span th:if="${ciudad.departamento != null}" 
                                      th:text="${ciudad.departamento.nombre}" 
                                      ></span>
                                <span th:if="${ciudad.departamento == null}" 
                                      class="text-muted">Sin departamento</span>
                            </td>
                           <td>
                            <div class="dropdown">
                                <button class="btn btn-dark btn-sm rounded-circle" type="button"
                                    data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="fa-solid fa-ellipsis-vertical"></i></button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/ciudades/{id}/editar(id=${ciudad.id})}">
                                            <i class="fa-solid fa-pen text-primary"></i> Editar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item btn-eliminar" href="javascript:void(0)"
                                            th:attr="data-id=${ciudad.id}, data-nombre=${ciudad.nombre}">
                                            <i class="fa-solid fa-trash text-danger"></i> Eliminar
                                        </a>
                                    </li>
                                    <li>
                                        <a class="dropdown-item"
                                            th:href="@{/ciudades/{id}(id=${ciudad.id})}">
                                            <i class="fa-solid fa-eye text-info"></i> Ver detalles
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </td>
                        </tr>
                    </tbody>
                </table>

                <!-- Mensaje cuando no hay ciudades -->
                <div th:if="${#lists.isEmpty(ciudades)}" class="text-center mt-4">
                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        No hay ciudades registradas en el sistema.
                    </div>
                </div>
            </div>
        </div>

        <!-- SweetAlert2 -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Scripts de mensajes -->
        <script th:if="${mensaje}">
            Swal.fire({
                title: '¡Éxito!',
                text: /*[[${mensaje}]]*/ 'Operación realizada satisfactoriamente',
                icon: 'success',
                confirmButtonText: 'Aceptar',
                confirmButtonColor: "#b8922f"
            })
        </script>
        
        <script th:if="${error}">
            Swal.fire({
                title: 'Error',
                text: /*[[${error}]]*/ 'Ocurrió un error',
                icon: 'error',
                confirmButtonText: 'Aceptar',
                confirmButtonColor: "#d33"
            })
        </script>
        
        <script>
        // Event listener para botones de eliminar
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.btn-eliminar').forEach(button => {
                button.addEventListener('click', function() {
                    const id = this.getAttribute('data-id');
                    const nombre = this.getAttribute('data-nombre');
                    confirmarEliminar(id, nombre);
                });
            });
        });

        // Función para confirmar eliminación de ciudad
        async function confirmarEliminar(id, nombre) {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                html: `<strong>Ciudad: ${nombre}</strong><br><br>No podrás deshacer esta acción.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#b8922f',  // dorado
                cancelButtonColor: '#0A0A0A',   // negro
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!result.isConfirmed) return;

            try {
                const response = await fetch(`/ciudades/${id}/eliminar`, {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });

                if (response.ok) {
                    Swal.fire({
                        title: '¡Eliminado!',
                        text: 'La ciudad ha sido eliminada con éxito.',
                        icon: 'success',
                        confirmButtonColor: '#0A0A0A', 
                        confirmButtonText: 'OK'
                    }).then(() => location.reload());

                } else {
                    Swal.fire({
                        title: 'Error',
                        text: `No se puede eliminar la ciudad porque esta asociada a un usuario`,
                        icon: 'error',
                        confirmButtonColor: '#0A0A0A', // negro
                    });
                }

            } catch (error) {
                Swal.fire({
                    title: 'Error',
                    text: 'Ocurrió un problema al intentar eliminar.',
                    icon: 'error',
                    confirmButtonColor: '#0A0A0A', // negro
                });
            }
        }
    </script>

    </body>
</html>
