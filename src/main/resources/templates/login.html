<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Maxigestion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
    <!-- ===== SIDEBAR (responsive) ===== -->
    <div th:replace="~{menú/sidebar :: sidebar}"></div> 

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="main-content">
        <div class="container-fluid h-100">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">
                    <section class="card mx-auto">
                        <h1 class="text-center">INICIAR SESIÓN</h1>
                      
                        <!-- Mensajes -->
                        <div th:if="${errorMessage}" class="alert alert-danger">
                          <span th:text="${errorMessage}"></span>
                        </div>
                        <div th:if="${logoutMessage}" class="alert alert-success">
                          <span th:text="${logoutMessage}"></span>
                        </div>
                
                        <!-- Formulario -->
                        <form class="form" th:action="@{/login}" method="post">
                          <div class="form-group">
                            <label for="username" class="form-label">Usuario</label>
                            <input id="username" name="username" type="text" class="form-control" required />
                          </div>
                          <div class="form-group">
                            <label for="password" class="form-label">Contraseña</label>
                            <input id="password" name="password" type="password" class="form-control" required />
                          </div>
                          <button type="submit" class="btn-login w-100">INICIAR</button>
                          
                          <div class="text-center mt-3">
                            <p class="hint mb-2">
                              <a th:href="@{/registro}" class="text-decoration-none">
                                ¿Eres cliente Jurídico? Regístrate aquí
                              </a>
                            </p>
                            <p class="hint mb-0">
                              <a th:href="@{/recuperar-password}" class="text-decoration-none">
                                ¿Olvidaste tu contraseña?
                              </a>
                            </p>
                          </div>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
